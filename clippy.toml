# `axum::response::Response` is exactly 128 bytes, which is exactly clippy's
# default `large-error-threshold`, so every helper using the standard axum
# idiom `Result<T, Response>` (return an early HTTP error the caller can `?`)
# trips `result_large_err` on the nose. Boxing the response at each of those
# helpers would churn every construction and every `?` site to satisfy a lint
# that is measuring an idiom, not a problem. 192 clears `Response` with
# headroom while still flagging an error type that is genuinely large.
#
# The affected helpers live in src/server/api/.
large-error-threshold = 192

# AGENTS.md asks for table cases inside one test when setup is shared, and a
# table's row type is a tuple of the inputs plus the expectation. Those tuples
# score as "complex types" while being the clearest form the case can take, and
# naming each one-use row type adds a line of noise per table. 350 clears the
# test tables while still flagging genuinely tangled types in production code.
type-complexity-threshold = 350
