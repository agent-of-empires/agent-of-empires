# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Maintainer review assistance; humans approve scope, implementation, and merge.
# Reference: https://docs.coderabbit.ai/reference/configuration
# Keep checks advisory and leave CI-owned lint and title gates to CI.

language: en-US

tone_instructions: "Be concise and evidence-first. Prioritize correctness, security, regressions, and missing verification. State the impact and what would satisfy each finding. Avoid speculative improvements and repeated CI lint feedback."

# Do not opt into early-access features.
early_access: false
enable_free_tier: true

reviews:
  profile: chill

  # CodeRabbit advises; human code owners approve.
  auto_approvals:
    enabled: false
    allow_author_approval: false

  high_level_summary: true
  high_level_summary_instructions: |
    Give maintainers a concise review brief: user-visible behavior changed,
    affected areas, linked-issue coverage and scope deviations, and concrete
    risks. Separate author-reported verification from checks you observed;
    identify missing evidence without claiming tests ran. Link related work.
    Leave scope approval, issue disposition, and merge decisions to humans.
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false

  auto_title_placeholder: "@coderabbitai title"
  auto_title_instructions: |
    Follow CONTRIBUTING.md and .github/workflows/pr-title-check.yml:
    use <type>(<optional scope>): <lowercase subject>, with a concise,
    imperative subject describing the change.

  review_status: true
  # Show review progress, not an additional legacy commit status or merge gate.
  review_progress: true
  commit_status: false
  fail_commit_status: false

  collapse_walkthrough: false
  changed_files_summary: true
  # Auto mermaid on most diffs adds noise; opt back in once we miss it.
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true

  # The repository's triage labels describe issues, not PR review readiness.
  suggested_labels: false
  auto_apply_labels: false

  # Reviewer routing is handled by CODEOWNERS teams.
  suggested_reviewers: false
  auto_assign_reviewers: false

  in_progress_fortune: false
  poem: false

  enable_prompt_for_ai_agents: true

  path_filters: []

  # Canonical policy documents are loaded below, not copied into path rules.
  path_instructions: []

  abort_on_close: true
  disable_cache: false

  auto_review:
    enabled: true
    # Incremental reviews pause after five reviewed commits by default.
    auto_incremental_review: true
    ignore_title_keywords:
      - "Dependencies"
      - "update dependency"
      - "wip"
      - "dependabot"
    labels: []
    drafts: false
    base_branches: ["main"]
    ignore_usernames: []

  # Manually triggered finishing touches still require human review.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true

  # Advisory readiness checks, not evidence of human approval or passing CI.
  pre_merge_checks:
    # AGENTS.md requires useful documentation, not blanket docstring coverage.
    docstrings:
      mode: "off"
    issue_assessment:
      mode: warning
    title:
      # The PR Title Check workflow owns enforcement.
      mode: "off"
    description:
      mode: warning
    # Custom checks require CodeRabbit Team or above.
    custom_checks:
      - name: Scope evidence
        mode: warning
        instructions: |
          Use CONTRIBUTING.md and linked issue/PR discussion as the source of
          truth. Pass for changes that do not introduce significant features or
          architecture changes, or when the description links the agreed design,
          acceptance criteria, and non-goals for such a change. Warn when a
          significant feature or architecture change has no linked scope
          discussion, or when the diff contradicts explicit agreed non-goals.
          If linked discussion cannot be read or agreement is ambiguous, return
          Inconclusive and identify the missing evidence. Cite the specific gap
          and what would satisfy it. An issue link alone is not approval.
          Do not inspect reviewer assignments or approval status, infer human
          approval from this check, or approve, close, assign, or merge anything.
      - name: Verification evidence
        mode: warning
        instructions: |
          Check the PR description against the actual changed surfaces and the
          testing requirements in AGENTS.md and any applicable nested AGENTS.md.
          Pass when it reports applicable commands and outcomes, behavior
          exercised, and any coverage limitations. For user-facing web or
          TUI/CLI changes, require the relevant Test Coverage Analysis choice
          from .github/pull_request_template.md, with a reason if tests are
          skipped, and a screenshot or recording for UI changes. For config-only
          or docs-only changes, accept relevant validation without Rust tests.
          Warn for missing applicable evidence or a coverage choice that
          contradicts the diff. Return Inconclusive if required context is
          unavailable. Cite the missing evidence and what would satisfy it.
          Do not run repository code or claim author-reported tests were
          independently verified; green CI alone does not prove behavior.

  tools:
    # CI already runs `cargo clippy -- -D warnings` and the web `eslint`
    # config; leaving them off here avoids duplicate signal in PR comments.
    clippy:
      enabled: false
    eslint:
      enabled: false
    # Things CI does not cover and that are cheap to surface inline.
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    # Off by default; opt back in once we know what kind of noise they make.
    shellcheck:
      enabled: false
    languagetool:
      enabled: false
    checkov:
      enabled: false
    actionlint:
      enabled: false
    semgrep:
      enabled: false
    dotenvLint:
      enabled: false

chat:
  art: true
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    # Include contribution and authority policy alongside coding guidelines.
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/DESIGN.md"
      - "CONTRIBUTING.md"
      - "MAINTAINERS.md"
  # `auto` uses local context for public repos, global for private repos.
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  mcp:
    usage: enabled

code_generation:
  docstrings:
    language: en-US

# Duplicate/related-work enrichment is advisory; humans decide disposition.
# Humans opt issues into planning with ready-for-agent; needs-triage vetoes it.
# Positive labels OR-match; exclusions always win. Planning requires Team+.
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - ready-for-agent
        - "!needs-triage"
  labeling:
    auto_apply_labels: false
    # Suggest only the existing intake label, never promote to ready-for-agent.
    labeling_instructions:
      - label: needs-triage
        instructions: |
          Suggest when an issue still needs maintainer evaluation, including
          missing information or a possible duplicate. Follow
          docs/agents/triage-labels.md and CONTRIBUTING.md. Do not suggest
          ready-for-agent, decide acceptance, close issues, or change assignees.
