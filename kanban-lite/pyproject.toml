[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe-kanban-lite"
version = "0.1.0"
description = "Read-only Kanban board view of your Agent of Empires sessions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
aoe-kanban-lite-worker = "aoe_kanban_lite.main:main"

[tool.setuptools.packages.find]
where = ["src"]
