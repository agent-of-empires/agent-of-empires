<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="win-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="win-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="150" cy="150" rx="360" ry="240" fill="url(#glow)"/>

  <!-- Mark -->
  <g transform="translate(58, 113)">
    <rect x="10" y="38" width="76" height="60" rx="6" fill="url(#win-back)" opacity="0.6"/>
    <rect x="20" y="28" width="76" height="60" rx="6" fill="url(#win-mid)" opacity="0.7"/>
    <rect x="32" y="18" width="82" height="66" rx="6" fill="url(#win-front)"/>
    <rect x="32" y="18" width="82" height="18" rx="6" fill="url(#titlebar)"/>
    <rect x="32" y="30" width="82" height="6" fill="url(#titlebar)"/>
    <circle cx="46" cy="28" r="2.8" fill="#b45309" opacity="0.55"/>
    <circle cx="55" cy="28" r="2.8" fill="#b45309" opacity="0.55"/>
    <circle cx="64" cy="28" r="2.8" fill="#b45309" opacity="0.55"/>
    <rect x="36" y="39" width="74" height="41" rx="3" fill="#b45309" opacity="0.22"/>
    <text x="45" y="65" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="bold" fill="#fef3c7" opacity="0.85">$</text>
    <rect x="64" y="51" width="9" height="17" rx="2" fill="#fef3c7" opacity="0.75"/>
  </g>

  <text x="200" y="89" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="13" fill="#f59e0b" letter-spacing="0.18em">LIVE ON DISCORD  ·  EVERYONE WELCOME</text>

  <text x="200" y="147" font-family="'Satoshi', 'DM Sans', 'Inter', system-ui, sans-serif" font-size="54" font-weight="900" fill="#f8fafc" letter-spacing="-0.01em">Office Hours</text>

  <text x="200" y="183" font-family="'DM Sans', 'Inter', system-ui, sans-serif" font-size="19" fill="#cbd5e1">Ask us anything, meet the community, learn how to contribute.</text>

  <g transform="translate(200, 219)">
    <rect width="196" height="44" rx="22" fill="url(#cta)"/>
    <text x="98" y="28" text-anchor="middle" font-family="'DM Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#451a03">RSVP on Discord</text>
  </g>

  <!-- Schedule card: one time, so the banner never needs a re-render when a timezone shifts -->
  <g>
    <rect x="868" y="105" width="268" height="132" rx="16" fill="#f8fafc" opacity="0.03"/>
    <rect x="868.5" y="105.5" width="267" height="131" rx="15.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.7"/>
    <text x="1002" y="138" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" fill="#f59e0b" letter-spacing="0.18em">EVERY TUESDAY</text>
    <line x1="900" y1="154" x2="1104" y2="154" stroke="#334155" stroke-width="1" opacity="0.8"/>
    <text x="1002" y="190" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="28" font-weight="600" fill="#fbbf24">9:00 AM ET</text>
    <text x="1002" y="214" text-anchor="middle" font-family="'DM Sans', 'Inter', system-ui, sans-serif" font-size="14" fill="#94a3b8">New York</text>
  </g>

  <rect x="0" y="296" width="1200" height="4" fill="url(#accent-line)"/>
</svg>
