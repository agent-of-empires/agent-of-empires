name: Tests

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs also need checks.
  pull_request:
  merge_group:

# The event keeps a queue run and the push of its fast-forwarded commit apart.
# Queue generations have distinct refs; cancel-obsolete-queue-runs handles them.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Killswitch: repo variable RUNS_ON_DISABLED=true sends RunsOn jobs to
  # GitHub-hosted runners and keeps kache off AWS (e.g. during an AWS outage).
  RUNS_ON_DISABLED: ${{ vars.RUNS_ON_DISABLED }}
  # .cargo/config.toml caps jobs at 4 for shared dev machines; CI runners are
  # single-tenant, so use every vCPU.
  CARGO_BUILD_JOBS: default

permissions:
  contents: read

jobs:
  cargo-linux:
    # Each leg builds its own feature set on its own runner and cache key. The
    # branch ruleset requires every leg's context by name; keep it in sync if
    # the leg set changes.
    name: Cargo Test (linux, ${{ matrix.leg }})
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-cargo-{1}-{2}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, matrix.leg, github.run_attempt) }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        leg: [web-e2e, core-rest, bare-core]
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run repository-controlled build/test code after checkout
          # and never push, so the job token must not linger in .git/config
          # (zizmor artipacked). Matches the hardened convention in ci.yml and
          # release.yml.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            acp-worker/test-shim/package-lock.json
      - name: Validate web lockfile
        if: matrix.leg == 'web-e2e'
        working-directory: web
        run: npm ci --dry-run --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/kache
        with:
          manifest-key: test-${{ matrix.leg }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: matrix.leg == 'core-rest'
        with:
          tool: cargo-nextest
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # RunsOn appends `. /etc/environment` to /etc/profile, so every login shell
      # resets PATH and aoe's login-shell launches lose the e2e stub dirs.
      - name: Keep inherited PATH in login shells
        run: sudo sed -i '/runs-on\/env/d' /etc/profile
      - name: Install confined Local test prerequisites
        if: matrix.leg == 'web-e2e'
        run: |
          sudo apt-get install -y bubblewrap iproute2 apparmor
          # The packaged profile denies capabilities to bwrap children, including ip.
          # Replace it only in memory on this disposable runner; keep network isolation.
          sudo apparmor_parser -r -K <<'PROFILE'
          abi <abi/4.0>,
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
      # tests/integration/acp_smoke.rs spawns the Node ACP shim under
      # acp-worker/test-shim/. The shim depends on @agentclientprotocol/sdk,
      # so its deps must be installed before the integration crate runs. Only
      # the core-rest leg runs the integration binary; the web-e2e leg uses
      # the fake ACP agent under web/tests/helpers/ instead, and bare-core does
      # not exercise the shim. Node here is a test-runtime dependency, not a
      # build one: core-rest's `cargo build` never invokes npm.
      - name: Install ACP shim deps
        if: matrix.leg == 'core-rest'
        working-directory: acp-worker/test-shim
        run: npm ci
      # web-e2e: just the e2e binary, and the only leg that builds the
      # dashboard bundle. The e2e target is gated behind the `e2e-tests`
      # feature so the core-rest leg below can skip it; this leg opts in.
      #
      # Test threads: about 0.75 per vCPU (6 on the 8 vCPU RunsOn runner, 3 on
      # 4 vCPU GitHub-hosted fallbacks). Only tests that mutate process-global
      # env stay `#[serial]` (tests/e2e/harness.rs); the rest isolate through
      # per-Command env and a per-test tmux socket. More threads per core
      # trade wall time for flake risk on tests that wait on an ACP handshake.
      - name: Build tests (web, e2e)
        if: matrix.leg == 'web-e2e'
        run: cargo test --features web,e2e-tests --test e2e --test integration --lib --no-run
      - name: Cargo test (web, e2e only)
        if: matrix.leg == 'web-e2e'
        env:
          AOE_REQUIRE_LOCAL_NETWORK_TESTS: '1'
          E2E_THREADS: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && '3' || '6' }}
        run: cargo test --features web,e2e-tests --test e2e -- --test-threads="$E2E_THREADS"
      # Run Web-only regressions omitted by core-rest. Keep e2e-tests to reuse
      # this leg's artifacts, and filter library tests instead of rerunning
      # the full suite.
      - name: Cargo test (web-gated test blocks)
        if: matrix.leg == 'web-e2e'
        run: |
          cargo test --features web,e2e-tests \
            --test integration -- daemon_core_web_optional plugin_install
          cargo test --features web,e2e-tests --lib -- \
            server::assets:: tui::dialogs::serve::qr_seam \
            session::config::tests::web_plugin_changes_do_not_cross_lifecycle_transactions
      # macOS reaches its per-user temp root through a symlink, so a test that
      # compares `TempDir::path()` against a path that has been through
      # `canonicalize()` or a reported cwd passes on Linux and fails there.
      # That asymmetry has broken main twice (#3535, #3919), and the macOS
      # leg only runs post-merge, so nothing catches it on the PR. Pointing
      # TMPDIR at a symlink reproduces the difference on the leg that runs the
      # unit tests, where this class lives.
      #
      # Scoped to core-rest deliberately: lib + bins + integration were measured
      # clean under a symlinked root, the e2e legs were not, and those are the
      # ones binding sockets under `temp_dir()`. Keep the path short for the
      # same reason (`sun_path` is 104 bytes on macOS, and src/tmux/vt.rs binds
      # inside `temp_dir()`).
      - name: Symlinked temp root
        if: matrix.leg == 'core-rest'
        run: |
          mkdir -p /tmp/aoe-real
          ln -sfn /tmp/aoe-real /tmp/aoe-link
          echo "TMPDIR=/tmp/aoe-link" >> "$GITHUB_ENV"
      # core-rest: the full default-feature suite minus e2e (lib + bins +
      # the consolidated integration binary). The daemon is core, so this
      # leg covers it end to end with no dashboard bundle and no npm in the
      # build. Without `e2e-tests` the e2e target is gated off, so it is
      # skipped here while every non-e2e test binary stays auto-discovered.
      # nextest runs one process per test and the test binaries concurrently,
      # so no test can pass on state an earlier one left behind.
      - name: Build tests (default features)
        if: matrix.leg == 'core-rest'
        run: cargo nextest run --no-run
      - name: Cargo test (default features, everything except e2e)
        if: matrix.leg == 'core-rest'
        # Echo the temp root so a silently-dropped TMPDIR is visible in the log
        # rather than passing as a green run with the guard gone.
        run: |
          echo "TMPDIR=${TMPDIR:-unset}"
          cargo nextest run --no-fail-fast
      - name: Require scoped cancellation coverage
        if: matrix.leg == 'core-rest'
        env:
          AOE_REQUIRE_SCOPED_TESTS: '1'
        run: |
          uid="$(id -u)"
          manager="user@${uid}.service"
          started_manager=0
          cleanup_manager() {
            status=$?
            if [ "$started_manager" -eq 1 ]; then
              if ! sudo systemctl stop "$manager" && [ "$status" -eq 0 ]; then
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup_manager EXIT
          if ! sudo systemctl is-active --quiet "$manager"; then
            started_manager=1
            sudo systemctl start "$manager"
          fi
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/dev/null
          test -S "$XDG_RUNTIME_DIR/systemd/private"
          cargo nextest run --test integration --no-tests=fail \
            serve_dynamic_profile_rewire::permanent_scratch_delete_cancels_an_unanswered_initialize
      # bare-core: selected lifecycle e2e tests without `web` (the web-e2e leg
      # covers the rest). `default-plugins` is an empty compat flag, so lib and
      # bin tests here would repeat core-rest.
      - name: Build tests (bare core)
        if: matrix.leg == 'bare-core'
        run: cargo test --no-default-features --features vendored,e2e-tests --test e2e --no-run
      - name: Cargo test (bare core, selected e2e)
        if: matrix.leg == 'bare-core'
        run: |
          cargo test --no-default-features --features vendored,e2e-tests --test e2e -- \
            --test-threads=3 cli:: new_session::
      # A default `cargo build` must ship the daemon without invoking Node
      # (#3619). Shadow node and npm with failing stubs so a `web`-gate
      # regression in build.rs fails here rather than silently reintroducing
      # the toolchain requirement for every source build.
      - name: Cargo build without a Node toolchain
        if: matrix.leg == 'bare-core'
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          for stub in node npm npx; do
            printf '#!/bin/sh\necho "$0 must not be invoked by a default cargo build" >&2\nexit 1\n' \
              > "$RUNNER_TEMP/no-node/$stub"
            chmod +x "$RUNNER_TEMP/no-node/$stub"
          done
          PATH="$RUNNER_TEMP/no-node:$PATH" cargo build
      # Folded in from a former standalone `hook-privdrop` job. That job existed
      # only to build a lib test binary it could re-run under sudo, which meant a
      # third full compile of the crate at a third feature set (~1.7 min) plus
      # its own cache slot. This leg has already built the lib test
      # binary, and the privdrop tests are core, so they are present in it.
      # Reusing that binary makes the privileged run nearly free.
      #
      # The privileged step is safe only on a disposable runner (GitHub-hosted
      # or single-job RunsOn). Do not move this leg to a persistent machine.
      - name: Exercise alien uid guards (privdrop)
        if: matrix.leg == 'core-rest'
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(
            cargo test --no-run --lib --message-format=json \
              | jq -r '
                  select(
                    .reason == "compiler-artifact"
                    and .profile.test == true
                    and .target.name == "agent_of_empires"
                    and .executable != null
                  )
                  | .executable
                ' \
              | tail -n 1
          )"
          test -n "$test_binary"
          test -x "$test_binary"
          test_count="$(
            "$test_binary" privdrop_ --list \
              | awk '/: test$/ { count += 1 } END { print count + 0 }'
          )"
          if [ "$test_count" -ne 4 ]; then
            echo "expected 4 privdrop tests, found $test_count"
            exit 1
          fi
          sudo env AOE_PRIVDROP_TESTS=1 \
            "$test_binary" privdrop_ --test-threads=1 --nocapture

  macos-gate:
    # Decides on Linux whether macOS runs, so a skip holds no macOS runner.
    # It runs for macOS-sensitive changes or the ci-macos label. After adding
    # the label, re-run this job; GitHub re-runs its dependents with it.
    name: macOS gate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        with:
          script: |
            const run = reason => { core.notice(`macOS runs: ${reason}`); core.setOutput('run', 'true'); };
            const pr = context.payload.pull_request;
            const queue = context.payload.merge_group;
            // refs/heads/gh-readonly-queue/<base>/pr-<number>-<base sha>
            const number = pr?.number ?? Number(/\/pr-(\d+)-[0-9a-f]+$/.exec(process.env.QUEUE_REF)?.[1]);
            if (!number) return run(`no PR number in ${process.env.QUEUE_REF}`);
            const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (current.labels.some(l => l.name === 'ci-macos')) return run('ci-macos label');

            const prefixes = [
              'src/process/', 'src/git/', 'src/migrations/', 'src/containers/',
              'src/session/config/container_config/',
              '.github/actions/rust-toolchain/',
            ];
            // Existing macOS-only bodies can change without touching their cfg.
            const exact = [
              'src/hooks/dir_guard.rs', 'src/server/api/system.rs',
              'src/session/mod.rs', 'src/sound/playback.rs',
              'src/tui/clipboard.rs', 'src/tui/open_url.rs',
              'src/session/config/container_config.rs',
              'src/session/instance/container.rs',
              'src/session/sandbox_store_reclaim.rs',
              'build.rs', 'Cargo.lock', 'rust-toolchain.toml',
            ];
            const cfg = /target_os\s*=\s*"macos"/;
            const sensitive = path => !!path &&
              (exact.includes(path) || prefixes.some(p => path.startsWith(p)));
            // A queue entry is diffed whole, so every PR in the group counts.
            const base = pr ? pr.base.sha : queue.base_sha;
            const head = pr ? pr.head.sha : queue.head_sha;
            const { data: diff } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${base}...${head}`,
            });
            // The compare API lists at most 300 files.
            if (diff.files.length >= 300) return run('diff too large to inspect');
            const hit = diff.files.find(f =>
              sensitive(f.filename) || sensitive(f.previous_filename) ||
              !f.patch || f.patch.split('\n').some(line =>
                /^[+-](?![+-]{2} )/.test(line) && cfg.test(line)));
            if (hit) return run(`${hit.filename} is macOS-sensitive`);
            core.notice('macOS skipped: runs post-merge on main. Add ci-macos and re-run this job to run it here.');
            core.setOutput('run', 'false');

  cargo-macos:
    # Push always runs; a failed gate also runs it rather than pass unchecked.
    # Both Cargo steps share e2e-tests; no frontend build is needed on macOS.
    name: Cargo Test (macos)
    needs: macos-gate
    if: ${{ !cancelled() && (needs.macos-gate.result != 'success' || needs.macos-gate.outputs.run == 'true') }}
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    # Allow cold compilation and both test stages within a bounded job.
    timeout-minutes: 90
    env:
      # The 7 GB runner compiles the crate twice (lib and lib tests); skipping
      # debug info shrinks both. Backtraces lose file and line numbers.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run repository-controlled build/test code after checkout
          # and never push, so the job token must not linger in .git/config
          # (zizmor artipacked). Matches the hardened convention in ci.yml and
          # release.yml.
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/kache
        with:
          manifest-key: test-macos
      - name: Install tmux
        run: brew install tmux
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Two steps so the two crate compiles (lib, then lib tests) never run at
      # once: together they overflow the runner's 7 GB and swap.
      - name: Build lib and bins (macOS)
        run: cargo nextest run --features e2e-tests --bins --no-run
      - name: Build tests (macOS)
        run: |
          cargo nextest run --features e2e-tests --lib --bins --test integration --no-run
          cargo test --features e2e-tests --test e2e --no-run
      - name: Cargo test (macOS, lib + bins)
        run: cargo nextest run --features e2e-tests --lib --bins --no-fail-fast
      - name: Cargo test (macOS, daemon-only CLI reads)
        run: cargo nextest run --features e2e-tests --test integration -E 'test(cli_read_daemon::)' --no-fail-fast
      - name: Cargo test (macOS, acp live-daemon e2e)
        run: cargo test --features e2e-tests --test e2e -- acp_ --test-threads=1 --nocapture

  vitest:
    name: Vitest
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-vitest-{1}/runner=4cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 15
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run repository-controlled build/test code after checkout
          # and never push, so the job token must not linger in .git/config
          # (zizmor artipacked). Matches the hardened convention in ci.yml and
          # release.yml.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run Vitest with coverage
        working-directory: web
        run: npm run test:unit -- --coverage --reporter=default --reporter=junit --outputFile.junit=test-report.junit.xml
      # The bundled aoe-agent ACP adapter is a separate npm package with its
      # own node:test suite (transcript round-tripping, tool-kind mapping).
      # Nothing ran it before, so both of its test files could rot unnoticed;
      # it rides this job because Node is already set up here. Seconds to run,
      # and it is deliberately not part of the coverage upload below.
      - name: Install aoe-agent adapter dependencies
        working-directory: acp-worker/aoe-agent
        run: npm ci
      - name: aoe-agent adapter tests
        working-directory: acp-worker/aoe-agent
        run: npm test
      # Vitest's v8 coverage reporter emits LCOV paths relative to the
      # vitest cwd (web/), so SF: lines read "SF:src/...". Codecov
      # matches file paths against the PR diff, which uses repo-root
      # paths ("web/src/..."), so without this fixup new component
      # files report 0% coverage even when vitest hit 85%. The
      # Playwright coverage merge script already emits "web/src/..."
      # paths, so only the vitest LCOV needs the prefix.
      - name: Rewrite LCOV paths for codecov
        if: ${{ !cancelled() }}
        run: sed -i 's|^SF:src/|SF:web/src/|' web/coverage/vitest/lcov.info
      - name: Upload to Codecov (vitest flag)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The codecov-action's `files` input is additive, not restrictive:
          # with `disable_search: false` (the default), the CLI also walks
          # the workspace and uploads anything that looks like a coverage
          # report. That picks up web/tests/coverage-matrix.json and
          # coverage-matrix.exempt.json (our test-mapping metadata, not
          # coverage data) and ships them to Codecov on every run.
          # `disable_search: true` restricts the upload to the explicit
          # `files:` list.
          disable_search: true
          files: web/coverage/vitest/lcov.info
          flags: vitest
          name: vitest
          fail_ci_if_error: false
      - name: Upload test results to Codecov (vitest)
        if: ${{ !cancelled() }}
        # Test-analytics upload only; a Codecov network blip must not fail the job.
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: web/test-report.junit.xml
          flags: vitest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-coverage
          path: web/coverage/vitest/
          retention-days: 14

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run repository-controlled build/test code after checkout
          # and never push, so the job token must not linger in .git/config
          # (zizmor artipacked). Matches the hardened convention in ci.yml and
          # release.yml.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      # Clean production build, intentionally WITHOUT AOE_COVERAGE: the inline
      # sourcemaps the coverage build emits inflate chunk sizes and would
      # report bogus bundle stats. The @codecov/vite-plugin uploads bundle
      # stats to Codecov
      # when CODECOV_TOKEN is present (gated in web/vite.config.ts); without
      # the token the plugin is a no-op, so forks still build cleanly.
      - name: Build web bundle and upload stats to Codecov
        working-directory: web
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npm run build

  playwright:
    name: Playwright (mocked)
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-playwright-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 20
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run repository-controlled build/test code after checkout
          # and never push, so the job token must not linger in .git/config
          # (zizmor artipacked). Matches the hardened convention in ci.yml and
          # release.yml.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build web with coverage instrumentation
        working-directory: web
        env:
          AOE_COVERAGE: '1'
        run: npm run build
      - name: Validate coverage matrix
        working-directory: web
        run: node tests/validate-coverage-matrix.mjs
      # The Playwright browser cache (~150MB chromium) is keyed on the
      # web/package-lock.json hash so it invalidates when @playwright/test
      # bumps. --with-deps is omitted: the ubuntu-latest runner image
      # already ships the apt packages Chromium needs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium
      - name: Run Playwright (mocked) with coverage
        working-directory: web
        env:
          AOE_COVERAGE: '1'
        run: npx playwright test --config=playwright.config.ts
      - name: Build LCOV from collected Playwright coverage
        working-directory: web
        if: ${{ !cancelled() }}
        run: npm run coverage:merge
      - name: Upload to Codecov (playwright-mocked flag)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # See the matching comment in the vitest upload step: without
          # disable_search the action also picks up the coverage-matrix
          # JSON files under web/tests/ and ships them as if they were
          # coverage reports.
          disable_search: true
          files: web/coverage/merged/lcov.info
          flags: playwright-mocked
          name: playwright-mocked
          fail_ci_if_error: false
      - name: Upload test results to Codecov (playwright-mocked)
        if: ${{ !cancelled() }}
        # Test-analytics upload only; a Codecov network blip must not fail the job.
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: web/test-report.junit.xml
          flags: playwright-mocked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-mocked-coverage
          path: web/coverage/merged/
          retention-days: 14

  playwright-live:
    # Unsharded: shards each repeat the ~2 min cargo build and hold a runner
    # from the shared concurrency pool, which costs more wall than it saves.
    name: Playwright (live)
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-playwright-live-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run repository-controlled build/test code after checkout
          # and never push, so the job token must not linger in .git/config
          # (zizmor artipacked). Matches the hardened convention in ci.yml and
          # release.yml.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/kache
        with:
          manifest-key: playwright-live
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Debug build instead of --release: --release with LTO and
      # codegen-units=1 cost ~6 min on the GitHub runner; debug builds
      # the same binary in ~2 min with no relevant runtime difference
      # for e2e tests. The harness derives the tmux prefix from the
      # binary path (aoe_dev_ for debug, aoe_ for release) so specs
      # don't hard-code either.
      - name: Build aoe with instrumented web bundle
        env:
          AOE_COVERAGE: '1'
          # build.rs embeds `dist/` into the binary with rust-embed, and a
          # separate `.js.map` file has no serving path there, so this build
          # keeps INLINE sourcemaps. The mocked job uses external maps (much
          # smaller `.js`, far faster navigation); see web/vite.config.ts.
          AOE_COVERAGE_INLINE_SOURCEMAP: '1'
        run: cargo build --features web
      # Same scheme as the mocked job: cache Chromium under
      # ~/.cache/ms-playwright, key on the lockfile, skip --with-deps
      # because ubuntu-latest already has the apt prerequisites.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium
      - name: Run live Playwright with coverage
        working-directory: web
        env:
          AOE_COVERAGE: '1'
          AOE_E2E_BINARY: ${{ github.workspace }}/target/debug/aoe
          # 6 on the 8 vCPU RunsOn runner; GitHub-hosted fallbacks have 4.
          PW_LIVE_WORKERS: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && '3' || '6' }}
        run: npx playwright test --config=playwright.live.config.ts
      - name: Build LCOV from collected Playwright coverage
        working-directory: web
        if: ${{ !cancelled() }}
        run: npm run coverage:merge
      - name: Upload to Codecov (playwright-live flag)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # See the matching comment in the vitest upload step: without
          # disable_search the action also picks up the coverage-matrix
          # JSON files under web/tests/ and ships them as if they were
          # coverage reports.
          disable_search: true
          files: web/coverage/merged/lcov.info
          flags: playwright-live
          name: playwright-live
          fail_ci_if_error: false
      - name: Upload test results to Codecov (playwright-live)
        if: ${{ !cancelled() }}
        # Test-analytics upload only; a Codecov network blip must not fail the job.
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: web/test-report.junit.xml
          flags: playwright-live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-live-report
          path: web/playwright-live-report/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-live-coverage
          path: web/coverage/merged/
          retention-days: 14
