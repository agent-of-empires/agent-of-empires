name: Cancel obsolete queue runs

on:
  # Default-branch code only; no queue checkout, cache restoration or artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Tests]
    types: [requested]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  cancel:
    if: github.event.workflow_run.event == 'merge_group'
    # Each queue run starts one copy. RunsOn keeps them out of the shared
    # GitHub-hosted queue, where they waited up to 35 min behind PR jobs.
    # Copies cannot share a concurrency group: each handles only its own PR's
    # queue entry.
    runs-on: ${{ vars.RUNS_ON_DISABLED == 'true' && 'ubuntu-latest' || format('runs-on={0}-cancel-{1}/runner=1cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=125mbs', github.run_id, github.run_attempt) }}
    timeout-minutes: 5
    steps:
      # workflow_run's SHA belongs to the default branch, never the queue head.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const cancel = require('./.github/scripts/cancel-obsolete-queue-runs.cjs');
            await cancel({ github, context, core });
