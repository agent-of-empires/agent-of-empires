name: CodeQL

# Advanced setup, so query and path filtering can live in the repository. It
# replaces default setup rather than supplementing it: while default setup is
# enabled, GitHub rejects the SARIF this workflow uploads. Disable it under
# Settings > Advanced Security > Code scanning before merging a change here.

# Not on PRs or the merge queue: not a required check, and the Rust analysis
# alone holds a runner for ~15 minutes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

# Only the newest pending push waits behind the running analysis.
concurrency:
  group: codeql-${{ github.ref }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Rust gets m-family only: 16 GB at 4 vCPU, like the hosted runner.
    runs-on: ${{ vars.RUNS_ON_DISABLED == 'true' && 'ubuntu-latest' || format('runs-on={0}-codeql-{1}-{2}/runner={3}/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, matrix.language, github.run_attempt, matrix.language == 'rust' && '4cpu-linux-x64/family=m8a+m8i+m7i' || '2cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i') }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    env:
      # The Rust extractor enables `cfg(test)`, so `#[cfg(test)]` modules under
      # src/ are analyzed as shipped code. A path filter cannot reach them
      # because they sit in production files. The value is parsed as a list, so
      # the brackets are load-bearing: a bare `-test` fails the extractor.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "[-test]"
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
