name: E2E Recordings

on:
  pull_request:
    types: [labeled]

env:
  CARGO_TERM_COLOR: always
  # Killswitch: repo variable RUNS_ON_DISABLED=true sends RunsOn jobs to
  # GitHub-hosted runners and keeps kache off AWS (e.g. during an AWS outage).
  RUNS_ON_DISABLED: ${{ vars.RUNS_ON_DISABLED }}
  # .cargo/config.toml caps jobs at 4 for shared dev machines; CI runners are
  # single-tenant, so use every vCPU.
  CARGO_BUILD_JOBS: default

jobs:
  record:
    name: Record E2E Tests
    if: github.event.label.name == 'needs-recording'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-record-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-toolchain

      # The e2e suite drives Node helpers (the fake ACP agent), so Node is
      # needed at run time even though the default build invokes no npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # RunsOn appends `. /etc/environment` to /etc/profile, so every login shell
      # resets PATH and aoe's login-shell launches lose the e2e stub dirs.
      - name: Keep inherited PATH in login shells
        run: sudo sed -i '/runs-on\/env/d' /etc/profile

      - name: Install asciinema
        run: pipx install asciinema

      - name: Install agg
        run: |
          AGG_VERSION="1.7.0"
          curl -fsSL "https://github.com/asciinema/agg/releases/download/v${AGG_VERSION}/agg-x86_64-unknown-linux-gnu" -o /usr/local/bin/agg
          chmod +x /usr/local/bin/agg

      - name: Verify recording tools
        run: |
          tmux -V
          asciinema --version
          agg --version

      - name: Build tests
        run: cargo test --features e2e-tests --test e2e --no-run

      - name: Run e2e tests with recording
        env:
          RECORD_E2E: "1"
        run: cargo test --features e2e-tests --test e2e -- --nocapture

      - name: Upload recordings as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-media
          path: |
            target/e2e-media/*.gif
            target/e2e-media/*.cast
          if-no-files-found: warn
          retention-days: 30

      # GITHUB_TOKEN cannot upload with `gh --attach`, so link the artifact.
      - name: Link recordings on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          gifs=(target/e2e-media/*.gif)
          if [ ${#gifs[@]} -eq 0 ]; then
            echo "No GIF recordings found, skipping PR comment."
            exit 0
          fi

          body="## E2E Test Recordings"$'\n\n'
          body+="${#gifs[@]} GIFs and their .cast files are in the [e2e-media artifact]($RUN_URL) for 30 days."

          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## E2E Test Recordings"))) | .id' \
            | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body"
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
          fi
