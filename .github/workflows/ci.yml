name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked PR targets its parent branch rather than main,
  # and a base filter would leave every PR but the bottom of the stack with no
  # checks at all.
  pull_request:
  merge_group:

# The event keeps a queue run and the push of its fast-forwarded commit apart.
# Queue generations have distinct refs; cancel-obsolete-queue-runs handles them.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A push to main runs to completion so macOS results and kache seeds land;
  # a newer push waits as the single pending run.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  # Killswitch: repo variable RUNS_ON_DISABLED=true sends RunsOn jobs to
  # GitHub-hosted runners and keeps kache off AWS (e.g. during an AWS outage).
  RUNS_ON_DISABLED: ${{ vars.RUNS_ON_DISABLED }}
  # .cargo/config.toml caps jobs at 4 for shared dev machines; CI runners are
  # single-tenant, so use every vCPU.
  CARGO_BUILD_JOBS: default

permissions:
  contents: read

jobs:
  quick-checks:
    # Seconds-long checks share one runner. Release PR Up To Date fails a stale
    # release PR in the merge queue (see release-pr-fresh.sh) and passes elsewhere.
    name: Quick checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-quick-checks-{1}/runner=1cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # #3974: a raw NUL makes git treat a source file as binary and hide its
      # diff from review, while the code still compiles and passes tests.
      - name: Check no source file carries a raw NUL byte
        run: |
          set -euo pipefail
          python3 scripts/check-no-nul-in-source.py --self-test
          python3 scripts/check-no-nul-in-source.py
      # Self-tests for scripts other workflows rely on.
      - run: node --test .github/scripts/cancel-obsolete-queue-runs.test.cjs .github/scripts/macos-gate.test.cjs .github/scripts/change-gate.test.cjs
      - run: scripts/verify-shared-target.sh --self-test
      - run: python3 .github/scripts/select-internal-pr.py --self-test
      - run: python3 .github/scripts/check-dependabot-pr.py --self-test
      - run: python3 .github/scripts/classify-cachix-failure.py --self-test
      - run: python3 .github/scripts/nightly-notes.py --self-test
      - run: .github/scripts/release-pr-fresh.sh --self-test
      - run: python3 scripts/check-no-claude-in-core.py --self-test
      # Disabled until C25 to C29 remove Claude from core on
      # integration/claude-removal; enable there by dropping the `if`.
      - name: Check core has no Claude references
        if: ${{ false }}
        run: python3 scripts/check-no-claude-in-core.py
      - name: Release PR Up To Date
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: .github/scripts/release-pr-fresh.sh
      - uses: $/.github/actions/rust-toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-clippy-{1}/runner=4cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: $/.github/actions/kache
        with:
          manifest-key: clippy
      # `--all-features` so the `web`-gated dashboard tree gets linted too.
      # The web-dist placeholder stands in for the npm bundle that build.rs
      # would otherwise build, so this job still needs no Node setup; same
      # trick as the rustdoc step in the docs job.
      #
      # `--all-targets` so test binaries are linted too; rustfmt in Quick checks
      # type-checks nothing.
      - name: Clippy (all features)
        run: |
          mkdir -p target/ci-web-dist
          printf '<!doctype html><title>aoe clippy placeholder</title>\n' > target/ci-web-dist/index.html
          AOE_WEB_DIST="$PWD/target/ci-web-dist" cargo clippy --all-features --all-targets -- -D warnings
      # `serve` is a deprecated alias that only turns on `web` (#3619). A
      # `cfg(feature = "serve")` would therefore compile out under
      # `--features web` while still working under the alias: a silent split.
      # Gate on the source so the alias stays inert until it is removed.
      - name: Deprecated `serve` feature-gate guard
        run: |
          set -euo pipefail
          hits="$(grep -rn 'feature *= *"serve"' --include='*.rs' src/ tests/ build.rs || true)"
          if [ -n "$hits" ]; then
            echo "::error::cfg(feature = serve) found; the serve feature is an alias for web. Use feature = web:"
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: file_watch consolidation guard
        run: |
          set -euo pipefail
          hits="$(grep -rl 'notify::recommended_watcher' src/ || true)"
          unexpected="$(printf '%s\n' "$hits" | grep -v '^src/file_watch.rs$' | grep . || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::New notify::recommended_watcher found outside src/file_watch.rs:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

  msrv:
    name: MSRV
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-msrv-{1}/runner=4cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
      - name: Read rust-version
        id: msrv
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])' >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/rust-toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: $/.github/actions/kache
        with:
          manifest-key: msrv
      # Lib and bins only: dev-dependencies such as `serial_test` may need a
      # newer compiler without affecting anyone building aoe.
      - name: Check the locked graph on rust-version (core)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --locked --workspace
      - name: Check the locked graph on rust-version (web)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          mkdir -p target/ci-web-dist
          printf '<!doctype html><title>aoe msrv placeholder</title>\n' > target/ci-web-dist/index.html
          AOE_WEB_DIST="$PWD/target/ci-web-dist" cargo +"$MSRV" check --locked --workspace --features web

  web-lint:
    name: Lint (web)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-web-lint-{1}/runner=2cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting
        working-directory: web
        run: npm run format:check
      - name: Run ESLint
        working-directory: web
        run: npm run lint
      - name: Typecheck test helpers
        working-directory: web
        run: npm run typecheck:tests

  deny:
    name: Supply Chain
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-deny-{1}/runner=1cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=125mbs', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test toolchain editor
        run: |
          python3 -m venv "$RUNNER_TEMP/toolchain-editor"
          "$RUNNER_TEMP/toolchain-editor/bin/python" -m pip install --require-hashes -r .github/scripts/requirements-toolchain.txt
          "$RUNNER_TEMP/toolchain-editor/bin/python" .github/scripts/update-rust-toolchain.py --self-test
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  docs:
    # Also the skill check: both build xtask.
    name: Docs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-docs-{1}/runner=4cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:250mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/rust-toolchain
      - uses: $/.github/actions/kache
        with:
          manifest-key: docs
      - name: Build xtask and workspace member tests
        run: |
          cargo build -p xtask
          cargo test -p xtask -p aoe-plugin-api --no-run
      - name: Check skill file references valid CLI commands
        run: cargo xtask check-skill
      # The workspace declares no `default-members`, so every other `cargo
      # test` in these workflows is scoped to the root package (#3479).
      - name: Cargo test (non-default workspace members)
        run: cargo test -p xtask -p aoe-plugin-api
      - name: Check CLI docs are up-to-date
        run: |
          cargo xtask gen-docs
          git diff --exit-code docs/cli/reference.md \
            || (echo "::error::CLI docs are out of date. Run 'cargo xtask gen-docs' and commit." && exit 1)
      - name: Check web setting names are up-to-date
        run: |
          cargo xtask gen-settings-keys
          git diff --exit-code web/src/lib/generated/settingsKeys.ts \
            || (echo "::error::Web setting names are out of date. Run 'cargo xtask gen-settings-keys' and commit." && exit 1)
      - name: Check live wire types are up-to-date
        run: |
          cargo xtask gen-live-wire
          git diff --exit-code web/src/lib/generated/liveWire.ts \
            || (echo "::error::Live wire types are out of date. Run 'cargo xtask gen-live-wire' and commit." && exit 1)
      - name: Check rustdoc is warning-clean
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          mkdir -p target/ci-web-dist
          printf '<!doctype html><title>aoe docs placeholder</title>\n' > target/ci-web-dist/index.html
          AOE_WEB_DIST="$PWD/target/ci-web-dist" cargo doc --no-deps --features web

  nix:
    name: Nix Eval
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-nix-{1}/runner=1cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=125mbs', github.run_id, github.run_attempt) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # Runs before Nix is even installed: no toolchain, a couple of seconds, and
      # it covers the failure class from #3204 (an embedded asset dropped by the
      # Cargo source filter) on EVERY PR, which is why the compile-based Nix
      # Build job below only has to fire when the flake recipe itself changes.
      - name: Check embedded assets survive the Nix source filter
        run: |
          set -euo pipefail
          python3 scripts/check-nix-embedded-assets.py --self-test
          python3 scripts/check-nix-embedded-assets.py
      - uses: $/.github/actions/install-nix
      - name: Evaluate flake outputs (all systems)
        run: |
          set -euo pipefail
          nix --version

          echo "=== Flake metadata ==="
          nix flake metadata

          echo ""
          echo "=== Flake structure ==="
          nix flake show --all-systems

          SYSTEMS="x86_64-linux aarch64-linux aarch64-darwin"

          echo ""
          echo "=== Evaluating packages for all systems ==="
          for system in $SYSTEMS; do
            echo ""
            echo "--- $system ---"
            for pkg in default aoe-with-web; do
              printf "  %s: " "$pkg"
              if output=$(nix eval ".#packages.$system.$pkg.drvPath" --raw 2>&1); then
                echo "✓"
              else
                echo "✗"
                echo "::error::Evaluation failed for packages.$system.$pkg"
                echo "$output"
                exit 1
              fi
            done
          done

          echo ""
          echo "=== Evaluating devShells for all systems ==="
          for system in $SYSTEMS; do
            printf "%s: " "$system"
            if output=$(nix eval ".#devShells.$system.default.drvPath" --raw 2>&1); then
              echo "✓"
            else
              echo "✗"
              echo "::error::Evaluation failed for devShells.$system.default"
              echo "$output"
              exit 1
            fi
          done

          echo ""
          echo "=== All evaluations passed ==="

  nix-changes:
    # Decides on a 1 vCPU runner whether the 8 vCPU Nix builds below need to
    # boot at all; most runs touch no flake file.
    name: Nix Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-nix-changes-{1}/runner=1cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64', github.run_id, github.run_attempt) }}
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            BASE="$QUEUE_BASE_SHA"
          else
            # `before` is the pre-push SHA (covers multi-commit pushes); fall
            # back to the empty tree on the initial push where it is all-zero.
            if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git hash-object -t tree /dev/null)
            else
              BASE="$EVENT_BEFORE"
            fi
          fi
          # A git failure fails this job, which makes the builds run.
          files=$(git diff --name-only "$BASE"...HEAD)
          changed() {
            if grep -qE "$1" <<<"$files"; then
              echo true
            else
              echo false
            fi
          }
          # `flake.nix` carries the source filter, buildInputs and package
          # definitions; `flake.lock` pins nixpkgs and crane. Either can break
          # the build in a way evaluation cannot see.
          echo "build=$(changed '^(flake\.nix|flake\.lock)$')" >> "$GITHUB_OUTPUT"
          echo "web=$(changed '^(web/package-lock\.json|flake\.nix|flake\.lock)$')" >> "$GITHUB_OUTPUT"

  nix-build:
    name: Nix Build
    needs: nix-changes
    # Runs if the gate did not succeed, so a broken gate cannot pass this check.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')) && (needs.nix-changes.result != 'success' || needs.nix-changes.outputs.build == 'true') }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-nix-build-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb:250mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 45
    # Builds the default (aoe) crate through crane. Nix Eval only evaluates
    # derivations, so a flake recipe that compiles nowhere (a bad source filter,
    # a missing buildInput) passes it but fails here.
    #
    # Gated to the flake recipe itself, and deliberately NOT to `src/**`. This is
    # a ~20 minute compile with no binary cache, so firing it on every Rust PR
    # would roughly triple the CI critical path. The one code-driven way to break
    # the build source, adding an embedded asset the Cargo filter drops (#3204),
    # is covered on every PR by the seconds-long
    # `scripts/check-nix-embedded-assets.py` step in Nix Eval. Post-merge,
    # cachix-push.yml builds a Rust package on every push to main matching
    # `src/**`, `Cargo.*`, the build scripts or an embedded-asset directory
    # (see its `paths:` list), so wider breakage still surfaces there.
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/install-nix
      - name: Build default package
        run: nix build --no-link --print-out-paths -L .#packages.x86_64-linux.default

  nix-build-web:
    name: Nix Build Web
    needs: nix-changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')) && (needs.nix-changes.result != 'success' || needs.nix-changes.outputs.web == 'true') }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-nix-build-web-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb:250mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 30
    # Catches npmDepsHash desync at PR time even if the nix-npm-hash bot
    # is offline. Path-gated so Rust-only PRs keep fast feedback.
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/install-nix
      - name: Build aoe-web-frontend
        # Builds only the npm + vite frontend (validates npmDepsHash
        # as a side effect). Skips the full Rust crate so this job
        # runs in 1-2 min instead of 20-30 min; Cargo Test + Nix Eval
        # already cover the Rust side on every PR.
        run: |
          set -euo pipefail
          nix build --no-link .#packages.x86_64-linux.aoe-web-frontend

  website:
    name: Website Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-website-{1}/runner=2cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm install
      - name: Build
        working-directory: website
        run: npm run build
