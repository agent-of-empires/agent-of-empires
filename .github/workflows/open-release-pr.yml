name: Open Release PR

# Weekly release-staging PR (#1140). Runs every Wednesday at 08:17 UTC,
# computes the next-patch version from the latest `v*` tag, bumps
# `Cargo.toml` + `Cargo.lock`, and opens a PR labeled `release-staging`
# with a plain newest-first commit list in the body. Merging that PR
# fires `tag-release-pr.yml`, which tags the merge commit and triggers
# `release.yml`.
#
# The user-facing CHANGELOG.md and GitHub Release body are driven by
# git-cliff (see cliff.toml + release.yml). This workflow folds the
# regenerated CHANGELOG.md into the same staging commit as the Cargo
# bump so reviewers see the changelog diff before merging.
#
# The plain `git log` dump further down stays as the PR-body summary for
# maintainer review; #1387 tracks unifying it with the git-cliff render.
#
# The maintainer's only manual step is (optionally) editing the version
# bump in the PR (patch -> minor/major) before clicking merge.

on:
  schedule:
    # Every Wednesday at 08:17 UTC. Cron strings are interpreted in UTC
    # regardless of repo timezone, so this stays stable across DST shifts.
    # The off-hour minute (:17, not :00) avoids GitHub's top-of-hour
    # scheduled-run congestion, which was dropping or heavily delaying
    # the previous 09:00 trigger.
    - cron: '17 8 * * 3'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump to stage'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open weekly release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install release tools
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-edit,git-cliff

      - name: Read current version from Cargo.toml
        id: current
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: next
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          CURRENT="${{ steps.current.outputs.version }}"
          BASE="${CURRENT%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch|*) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "branch=release-staging/v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${CURRENT} -> ${NEXT} (${BUMP})"

      - name: Abort if tag already exists
        run: |
          TAG="${{ steps.next.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; choose a different bump or clean up the existing tag"
            exit 1
          fi

      - name: Abort if staging branch already exists upstream
        run: |
          BRANCH="${{ steps.next.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists upstream; merge or delete it first"
            exit 1
          fi

      - name: Bump Cargo.toml + Cargo.lock
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          cargo set-version --package agent-of-empires "$VERSION"
          # Refresh Cargo.lock so the [[package]] entry tracks the new version
          # without requiring a full build.
          cargo generate-lockfile --offline 2>/dev/null || cargo generate-lockfile
          echo "Cargo.toml head:"
          head -8 Cargo.toml
          echo "Cargo.lock head:"
          head -8 Cargo.lock

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ steps.next.outputs.version }}
          # cliff.toml enables [remote.github], so git-cliff pages the closed-PR
          # list to resolve commit -> PR -> author. Unauthenticated that is
          # capped at 60/hr on a shared runner IP, and the repo is now past 2100
          # closed PRs (22 pages), so the walk 403s and panics partway through.
          # release.yml and prepare-release.yml already pass this token; this
          # step was the one that missed it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # git-cliff panics on ANY http error from that metadata walk,
          # transient 5xx included, and has no internal retry. One blip loses
          # the whole weekly run and the miss is silent until someone notices
          # the PR never showed up. Observed 2026-08-28: a 502 on
          # /commits?page=15 killed an otherwise healthy run, and an immediate
          # re-dispatch succeeded.
          for attempt in 1 2 3; do
            if git cliff --config cliff.toml --tag "v$VERSION" \
                 --output CHANGELOG.md 2> cliff-stderr.log; then
              break
            fi
            echo "=== git-cliff attempt $attempt failed ==="
            cat cliff-stderr.log
            if [ "$attempt" = 3 ]; then
              echo "::error::git-cliff failed 3 times; see the stderr dumps above"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          echo "=== CHANGELOG.md head ==="
          head -40 CHANGELOG.md
          echo "=== cliff stderr ==="
          cat cliff-stderr.log
          # Mirror the guard release.yml and prepare-release.yml already carry.
          # cliff.toml's catch-all parser routes unmatched commits to "Other",
          # so a parse-error skip means something fell through the safety net.
          # Without this the weekly PR can open with commits silently missing
          # from the changelog diff the maintainer is reviewing.
          if grep -q "skipped due to parse error" cliff-stderr.log; then
            echo "::error::git-cliff skipped commits due to parse errors. Either fix the offending commit messages or extend cliff.toml's catch-all parser."
            exit 1
          fi

      - name: Compute changelog since last tag
        id: changelog
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            echo "No prior tag found; listing every commit on main"
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "Comparing $LAST_TAG..HEAD"
          fi

          # Simple newest-first commit dump. Proper conventional-commit
          # grouping lands once #1387 wires git-cliff in; until then, a
          # plain `git log` is honest about what's in the release and
          # avoids hand-rolled regex parsing that would just get thrown
          # away.
          {
            echo "## Changes since ${LAST_TAG:-the dawn of time}"
            echo
            git log ${RANGE} \
              --no-merges \
              --pretty=format:'- %s (`%h`, %an, %ad)' \
              --date=short
            echo
          } > /tmp/changelog.md

          echo "Generated changelog:"
          cat /tmp/changelog.md

      - name: Build PR body
        id: body
        run: |
          VERSION="${{ steps.next.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          {
            echo "<!-- release-version: ${VERSION} -->"
            echo
            echo "Automated weekly release-staging PR (#1140)."
            echo
            echo "**Current:** \`v${CURRENT}\`  "
            echo "**Proposed:** \`v${VERSION}\` (bump: \`${BUMP}\`)"
            echo
            echo "If you want a different semver bump, edit \`Cargo.toml\` + \`Cargo.lock\` on this branch, push the change, and the merge tagger will use whatever version is in \`Cargo.toml\` at merge time. The \`<!-- release-version: ... -->\` marker above is cross-checked by the tagger and must match."
            echo
            cat /tmp/changelog.md
            echo
            echo "## Maintainer checklist"
            echo
            echo "- [ ] Version bump is appropriate for the change set"
            echo "- [ ] No breaking changes hidden under \`refactor:\` / \`chore:\`"
            echo "- [ ] CI is green"
            echo "- [ ] Ready to ship — merge this PR to publish"
          } > /tmp/pr-body.md
          # Persist for the gh call
          echo "path=/tmp/pr-body.md" >> "$GITHUB_OUTPUT"

      - name: Commit and push branch
        env:
          VERSION: ${{ steps.next.outputs.version }}
          BRANCH: ${{ steps.next.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push -u origin "$BRANCH"

      - name: Open PR + label
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ steps.next.outputs.version }}"
          BRANCH="${{ steps.next.outputs.branch }}"
          # Create the `release-staging` label if it does not exist yet so
          # the first run of this workflow on a fresh repo does not fail.
          gh label create release-staging \
            --color "d93f0b" \
            --description "Weekly release-staging PRs auto-tagged on merge (#1140)" \
            --force >/dev/null 2>&1 || true
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: release v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label release-staging

  notify-on-failure:
    name: Report a failed weekly run
    needs: open-release-pr
    # Only for the scheduled trigger. A workflow_dispatch failure is already in
    # front of the person who clicked it; a schedule failure is what goes
    # unnoticed, which is how 2026-08-19 and 08-26 both passed without anyone
    # spotting that no release PR had opened.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'release-automation';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'd93f0b',
                description: 'Failures in the release automation workflows',
              });
            } catch (e) {
              // Already exists, which is the normal case after the first run.
            }

            // One open issue at a time. Later failures comment on it rather
            // than opening a duplicate every Wednesday, so a persistent break
            // stays a single thread instead of a weekly pile.
            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: open[0].number,
                body: `The weekly release PR failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Weekly release PR did not open',
                labels: [label],
                body: [
                  `The scheduled \`open-release-pr\` run failed, so no release-staging PR was opened this week.`,
                  ``,
                  `Failed run: ${runUrl}`,
                  ``,
                  `Re-run it with \`gh workflow run open-release-pr.yml --ref main -f bump=patch\` once the cause is addressed.`,
                ].join('\n'),
              });
            }
