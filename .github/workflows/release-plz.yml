name: Release-plz

# Tags `vX.Y.Z` when the release PR merges, and refreshes that PR on every push to main;
# release.yml takes it from the tag. CI skips release PRs; the merge queue tests them. Config: release-plz.toml. RELEASE_TOKEN is required
# because pushes and PRs made with GITHUB_TOKEN start no workflows (neither CI on the PR
# nor release.yml on the tag).

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Tag release
    # The merge queue can land the release PR mid-batch, so tag its own squash commit
    # rather than main's HEAD.
    if: >-
      github.repository == 'agent-of-empires/agent-of-empires' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-')
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-release-plz-tag-{1}/runner=2cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    permissions:
      contents: read
      actions: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Commits merged after the release PR's last refresh ship in the tag without a
      # CHANGELOG.md entry; see docs/development/releases.md.
      - name: Warn about commits missing from the changelog
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
          MERGE: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch -q origin "refs/pull/$PR/head"
          BASE="$(git merge-base FETCH_HEAD "$MERGE~1")"
          MISSED="$(git log --oneline "$BASE..$MERGE~1")"
          if [ -n "$MISSED" ]; then
            echo "::warning title=Missing from CHANGELOG.md::$(echo "$MISSED" | wc -l) commit(s) merged after the release PR's last refresh are tagged but not in CHANGELOG.md. See the job summary."
            { echo '### Tagged but missing from CHANGELOG.md'; echo; echo "$MISSED" | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Rust toolchain
        uses: $/.github/actions/rust-toolchain

      - name: Run release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # The push that landed this release skipped its refresh.
      - name: Refresh the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-plz.yml --repo "$GITHUB_REPOSITORY" --ref main

  release-pr:
    name: Update release PR
    # Skip a push that lands the release PR, even mid-batch: its version is not tagged yet.
    # Tag release dispatches the refresh once it is.
    if: >-
      github.repository == 'agent-of-empires/agent-of-empires' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !(github.event_name == 'push' && contains(toJSON(github.event.commits.*.message), 'chore: release v'))
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-release-plz-pr-{1}/runner=2cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64/volume=80gb:125mbs/extras=s3-cache', github.run_id, github.run_attempt) }}
    # Never cancel: a cancelled run can leave the release PR half-updated.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      # The kache build cache.
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: $/.github/actions/rust-toolchain

      - name: Run release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # release-plz force-pushes the release PR on every refresh, so a pin commit is
      # dropped and re-added there rather than landing on main. docs/development/releases.md
      - name: Resolve the release PR branch
        id: release_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="$(gh pr list --repo "$GITHUB_REPOSITORY" --label release --state open \
            --json headRefName \
            --jq 'map(select(.headRefName | startswith("release-plz-"))) | .[0].headRefName // ""')"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ -z "$BRANCH" ]; then
            echo "::notice::No open release PR; featured pins are left as they are."
          fi

      - name: Check out the release PR
        if: steps.release_pr.outputs.branch != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: $/.github/actions/kache
        if: steps.release_pr.outputs.branch != ''
        with:
          manifest-key: featured-pins

      # Pins every plugin release published since the newest pinned one, so the
      # release that ships this commit is what attests to them.
      - name: Pin featured plugin releases
        if: steps.release_pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.release_pr.outputs.branch }}
        run: |
          set -euo pipefail
          # One unpinnable upstream release must not hold back the others' pins.
          cargo xtask bump-featured-pins \
            || echo "::warning title=Featured pins::Some plugin releases could not be pinned; see this step's log."
          if git diff --quiet -- plugins/featured.toml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/featured.toml
          git commit -m "chore(plugins): pin featured plugin releases"
          git push origin "HEAD:$BRANCH"
