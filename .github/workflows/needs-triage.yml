name: needs-triage
on: { issues: { types: [opened] } }
permissions: { issues: write }
jobs:
  label:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label needs-triage
