name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  # Centralizes the "which ref do we operate on" rule so every job's checkout
  # stays in sync. Without this, workflow_dispatch silently fell back to main:
  # checkout's default ref ignored the `tag` input, so validation read main's
  # Cargo.toml and the build packaged main's binary while attaching it to the
  # requested tag's release.
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    # Required-reviewer gate. Pauses every release (tag push or manual
    # dispatch) until njbrake approves in the Actions UI. The whole pipeline
    # waits here, so no build compute or release publish runs without sign-off.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          # No job here pushes back to the repo; the Release is created via
          # softprops/action-gh-release using its own GITHUB_TOKEN. Skip the
          # default credential-persistence to shrink the token surface.
          persist-credentials: false

      - name: Validate version matches tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml has $CARGO_VERSION but tag is $TAG"
            echo "Release tags come from merging the release-plz PR, which bumps Cargo.toml first."
            exit 1
          fi
          echo "✓ Versions match"

  build:
    needs: validate
    uses: ./.github/workflows/build-binaries.yml
    with:
      # RELEASE_REF; `env` is not available to a reusable workflow call.
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Artifacts directory ==="
          ls -laR artifacts/
          echo "=== Finding tar.gz files ==="
          find artifacts -type f -name '*.tar.gz*' | head -20

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # release-plz wrote this version's section into CHANGELOG.md in the release PR.
        run: |
          awk -v heading="## [${VERSION#v}]" '
            index($0, "## [") == 1 { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No user-facing changes." > release-notes.md
          fi
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Agent of Empires ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish-clawhub:
    name: Publish to ClawHub
    needs: release
    runs-on: ubuntu-latest
    env:
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.CLAWHUB_TOKEN != ''

      - name: Install clawhub CLI
        if: env.CLAWHUB_TOKEN != ''
        run: |
          bun install -g clawhub

      - name: Publish skill
        if: env.CLAWHUB_TOKEN != ''
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          VERSION_NUM="${VERSION#v}"
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          clawhub publish contrib/openclaw-skill \
            --slug aoe \
            --name "Agent of Empires" \
            --version "$VERSION_NUM" \
            --tags latest

      - name: Skip notice
        if: env.CLAWHUB_TOKEN == ''
        run: echo "::notice::Skipping ClawHub publish -- CLAWHUB_TOKEN secret not configured"
