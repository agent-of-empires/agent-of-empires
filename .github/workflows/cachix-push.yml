name: Push to Cachix

# Builds aoe-with-web (default features, web UI embedded) for Linux and macOS
# and pushes the results to the Cachix binary cache so users can install
# without compiling. macOS runners are scarce, so a push builds macOS only when
# flake.nix, flake.lock or Cargo.lock change; a nightly run covers the rest.
#
# Requires two repository secrets:
#   CACHIX_AUTH_TOKEN  - from cachix.org (Settings > Auth Tokens)
#   CACHIX_CACHE_NAME  - your cache name (e.g. "agent-of-empires")

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'build_git_watch.rs'
      # Paths whose contents are embedded into the binary at compile time; a
      # change here must rebuild and re-push the cache even when it does not
      # touch src/ or the flake.
      - 'acp-worker/adapters/**'
      - 'docker/**'
      - 'themes/**'
      - 'plugins/**'
      # web/** is excluded: lockfile bumps land on main via the
      # nix-npm-hash bot's PR which bumps flake.nix in the same commit.
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

# The event keeps a push from cancelling the nightly macOS build.
concurrency:
  group: cachix-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick systems
    runs-on: ${{ vars.RUNS_ON_DISABLED == 'true' && 'ubuntu-latest' || format('runs-on={0}-cachix-plan-{1}/runner=1cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64', github.run_id, github.run_attempt) }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      systems: ${{ steps.pick.outputs.systems }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule) systems='["macos"]' ;;
            push)
              systems='["linux"]'
              # A base git cannot diff (first or force push) counts as a change.
              if ! changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")" \
                || grep -qE '^(flake\.nix|flake\.lock|Cargo\.lock)$' <<<"$changed"; then
                systems='["linux","macos"]'
              fi
              ;;
            *) systems='["linux","macos"]' ;;
          esac
          echo "systems=$systems" >> "$GITHUB_OUTPUT"

  cachix:
    name: Build and push (${{ matrix.system }})
    needs: plan
    runs-on: ${{ matrix.system == 'macos' && 'macos-latest' || (vars.RUNS_ON_DISABLED == 'true' && 'ubuntu-latest' || format('runs-on={0}-cachix-{1}/runner=4cpu-linux-x64/family=m8a+m8i+m7i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt)) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.plan.outputs.systems) }}

    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache).
      - if: matrix.system == 'linux'
        uses: runs-on/action@v2.6.0
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/install-nix

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ secrets.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build aoe-with-web
        run: nix build .#aoe-with-web

      - name: Push to Cachix
        run: cachix push ${{ secrets.CACHIX_CACHE_NAME }} ./result

  notify-on-failure:
    name: Report a failed build on main
    needs: [plan, cachix]
    # This is the only CI that compiles the Nix package on main, so a red push
    # or nightly run here otherwise goes unseen (#3217). A dispatch failure is
    # already in front of whoever started it.
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ${{ vars.RUNS_ON_DISABLED == 'true' && 'ubuntu-latest' || format('runs-on={0}-cachix-notify-{1}/runner=1cpu-linux-x64/family=m8a+c8i+m8i+c7i+m7i/image=ubuntu26-full-x64', github.run_id, github.run_attempt) }}
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Classify the failure
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Compare with the previous run of the same event, since push and
          # nightly runs build different systems. None in the window: alert.
          PREVIOUS=$(gh run list --repo "$REPO" --workflow cachix-push.yml --branch main --event "$EVENT" \
            --status completed --limit 100 --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId < $RUN_ID and .conclusion != \"cancelled\")][0].conclusion // \"failure\"")
          # --build-step must match the build step's `name:` above.
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            | python3 .github/scripts/classify-cachix-failure.py \
                --build-step "Build aoe-with-web" --previous-conclusion "$PREVIOUS" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Warn on a one-off infrastructure failure
        if: steps.classify.outputs.alert == 'false'
        run: echo "::warning::The Nix build did not fail; a setup or Cachix step did. Not opening an issue unless the next run on main fails too."

      - name: Open or update the tracking issue
        # Also runs when classification itself failed, so an API error still alerts.
        if: ${{ !cancelled() && steps.classify.outputs.alert != 'false' }}
        uses: actions/github-script@v9.0.0
        env:
          KIND: ${{ steps.classify.outputs.kind || 'unknown' }}
        with:
          script: |
            const label = 'nix-build';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const cause = {
              build: '`nix build .#aoe-with-web` failed, so main does not build under Nix.',
              infra: 'A setup or Cachix step failed, and the previous run on main also failed; check that run, the `CACHIX_*` secrets and Cachix status.',
              unknown: 'The failing step could not be identified; read the run log.',
            }[process.env.KIND];
            const summary = `${cause}\n\nRun: ${runUrl}\nCommit: ${context.sha}`;

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'b60205',
                description: 'The post-merge Nix build of main is failing',
              });
            } catch (e) {
              // Already exists.
            }

            // One open issue per outage; repeat failures comment on it.
            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: open[0].number,
                body: `Failed again. ${summary}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Nix build of main is failing',
                labels: [label],
                body: `${summary}\n\nClose this once a \`Push to Cachix\` run on main succeeds.`,
              });
            }
