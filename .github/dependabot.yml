version: 2
updates:
  # cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # docker
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7

  # github-actions
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm: web
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "area:web"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["minor", "patch"]
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["major"]
      web-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "tailwindcss"
          - "@tailwindcss/*"
          # Pre-1.0 minor updates may break compatibility; project policy
          # keeps them in separate PRs for review.
          - "@assistant-ui/*"
          - "eslint-plugin-react-refresh"
          - "oxfmt"
        update-types: ["minor", "patch"]
      # Batch pre-1.0 patches by project choice, not a SemVer compatibility guarantee.
      web-pre1-patch:
        patterns:
          - "@assistant-ui/*"
          - "eslint-plugin-react-refresh"
          - "oxfmt"
        update-types: ["patch"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns:
          - "@assistant-ui/*"
          - "eslint-plugin-react-refresh"
          - "oxfmt"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]

  # npm: acp-worker/aoe-agent
  - package-ecosystem: "npm"
    directory: "/acp-worker/aoe-agent"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "area:web"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      ai-sdk:
        patterns: ["@ai-sdk/*", "ai"]
        update-types: ["minor", "patch"]
      acp:
        patterns: ["@agentclientprotocol/*"]
        update-types: ["minor", "patch"]
      aoe-agent-other-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "@ai-sdk/*"
          - "ai"
          - "@agentclientprotocol/*"
        update-types: ["minor", "patch"]
      aoe-agent-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm: acp-worker/adapters/* (one pinned ACP adapter per directory).
  # These pins are what `aoe acp doctor --fix` installs, so without
  # dependabot the bundled adapter version rots by design (#1017). Kept
  # weekly, unlike the monthly entries, so users get upstream agent fixes.
  - package-ecosystem: "npm"
    directories:
      - "/acp-worker/adapters/claude-agent-acp"
      - "/acp-worker/adapters/codex-acp"
      - "/acp-worker/adapters/pi-acp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "area:infra"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      adapters-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm: acp-worker/test-shim
  - package-ecosystem: "npm"
    directory: "/acp-worker/test-shim"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "area:web"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      acp:
        patterns: ["@agentclientprotocol/*"]
        update-types: ["minor", "patch"]
      test-shim-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm: website
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
    groups:
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["minor", "patch"]
      website-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["minor", "patch"]
      website-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]

  # pip: CI toolchain editor
  - package-ecosystem: "pip"
    directory: "/.github/scripts"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area:infra"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28

  # pip: optional X publishing
  - package-ecosystem: "pip"
    directory: "/marketing/x"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 28
