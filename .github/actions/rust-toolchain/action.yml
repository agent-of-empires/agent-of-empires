name: Install Rust toolchain
description: >
  Installs the toolchain pinned in rust-toolchain.toml, so every job builds
  with the same reviewed version rather than whatever `stable` is today.

inputs:
  components:
    description: Extra rustup components, comma separated.
    required: false
    default: ''
  targets:
    description: Extra compilation targets, comma separated.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Read pinned channel
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        channel="$(python3 - <<'PY'
        import re
        import tomllib
        with open("rust-toolchain.toml", "rb") as f:
            channel = tomllib.load(f)["toolchain"]["channel"]
        if not isinstance(channel, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", channel):
            raise SystemExit(f"::error::Toolchain {channel!r} is not a pinned x.y.z version")
        print(channel)
        PY
        )"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
