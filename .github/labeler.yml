# Read by .github/workflows/labeler.yml. `ci-macos` runs the macOS suite on a
# PR (tests.yml); without it that suite first runs after merge (#4228, #4245).
# Diffs touching a `target_os = "macos"` cfg are labelled by the workflow.
ci-macos:
  - changed-files:
      - any-glob-to-any-file:
          - src/process/**
          - src/git/**
          - src/migrations/**
          - src/containers/**
          - src/session/config/container_config/**
          - src/session/instance/container.rs
          - src/session/sandbox_store_reclaim.rs
          - build.rs
          - Cargo.lock
          - rust-toolchain.toml
