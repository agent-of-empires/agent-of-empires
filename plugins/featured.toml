# Released and pinned at `v0.5.0`, so an install with no `@ref` resolves that
# tag instead of a moving default branch.
#
# 0.5.0 is the first release whose manifest declares `api_version = 21` with the
# launch, detection, resume, capture and reply declarations. A host older than
# 1.24.0 rejects that manifest in `PluginManifest::from_toml_str` with
# `UnsupportedApiVersion` and records a load error, so the plugin stays inactive
# there while the bundled `aoe.omp-fallback` contract keeps working. Pinning it
# here is what lets its reserved-namespace id install.
#
# plugin-omp v0.5.0 @ 2863be6a5425870c24316f7e9faa716c4019546f
[plugins."agent-of-empires.omp"]
source = "gh:agent-of-empires/plugin-omp"
versions = {"0.5.0" = "sha256:a2d718a00808b815ae6f3dcd7b05f6a81fdb6fedf642cb8883c42ef53889a962"}

# `versions` is what a featured install is verified against, keyed by the
# release tag it resolves to; it does not choose the tag. An install that names
# no `@ref` selects the plugin's latest release, `v0.1.1`, which is the pin
# below. 0.1.0 stays listed so an install already carrying it still verifies;
# it published nothing on OpenCode 2.
#
# 0.1.1 declares `api_version = 21` with `session.integration` for the built-in
# `opencode` tool and an `aoe_version` floor of `>=1.24.0`, so an older host
# rejects the manifest in `PluginManifest::from_toml_str` and records a load
# error while `opencode` keeps its bundled launch and pane detection. The
# provider extension lives in the same repository but is installed inside
# OpenCode, so install it first: once approved, this declaration owns status and
# a session with no report reads as Unknown. Disabling or uninstalling the
# plugin returns the session to pane detection.
#
# plugin-opencode v0.1.1 @ 84a4049
[plugins."agent-of-empires.opencode"]
source = "gh:agent-of-empires/plugin-opencode"
versions = {"0.1.0" = "sha256:78526b6fae6810aaa8396b524af2209c23a5a390de6ac18412f045f24aaa274d", "0.1.1" = "sha256:1b3a12924f0835cc0f08d715206cabd51f726b90d1535f3047cddd59092821c2"}
