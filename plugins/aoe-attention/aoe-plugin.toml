# First-party attention/triage plugin.
#
# Answers "who needs me?" across a fleet of sessions: it polls the host's
# session list and pushes a home-pane board (sessions grouped by urgency) plus a
# status-bar count of sessions waiting on input. The worker is the `aoe` binary
# re-invoked through the self-exec runtime; it reads the session list over the
# plugin protocol, so it declares `session.read` alongside `runtime.worker`.

id = "aoe.attention"
name = "Attention"
version = "1.0.0"
api_version = 13
description = "Groups your sessions by urgency on the dashboard and shows how many are waiting on input."
capabilities = ["runtime.worker", "session.read"]

[[ui]]
slot = "home-pane"
id = "board"

[[ui]]
slot = "status-bar"
id = "waiting"

[runtime]
kind = "self-exec"
subcommand = "__plugin-attention"
