id = "claude"

# The terminal title Claude publishes over OSC: a braille or half-circle spinner
# frame while a turn runs, a static glyph when it is over.
[[rules]]
id = "osc_title_working"
state = "running"
priority = 1100
region = "osc_title"
visible = true
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}]']

# A tool-permission prompt.
[[rules]]
extends = "approval_prompt"
id = "approval_prompt"
priority = 980
contains_any = ["do you want to", "would you like to proceed"]
line_regex = ['^\s*\x{276F}\s*[1-9]\.']

# The `AskUserQuestion` selection UI.
[[rules]]
id = "ask_user_question"
state = "waiting"
priority = 980
region = "whole_recent"
visible = true
line_regex = [
  '(?i)^\s*enter to select.*to navigate',
  '^\s*[\x{276F}>]?\s*[1-9]\.',
]

# The interrupt hint.
[[rules]]
extends = "interrupt_hint"
id = "interrupt_hint"
priority = 970
line_regex = ['(?i)^[ \t]*(?:[^"\x{23BF}+\s\d][^"]*)?(?:esc|ctrl\+c) to interrupt']

# The live token counter (`(4s · ↓ 88 tokens)`), which only renders while a turn
# generates.
[[rules]]
id = "live_token_counter"
state = "running"
priority = 970
region = "whole_recent"
visible = true
# `\d+\s*[hms]` rather than a contiguous token: a narrow pane wraps mid-token,
# putting the capture's newline between a duration's digits and its unit.
regex = ['(?m)\(\s*(?:\d+\s*[hms]\s+)*\d+\s*[hms]\s*·?\s*\x{2193}\s*\d+(?:\.\d+)?[kmg]?\s+tokens\s*\)\s*$']

# The `<frame> <Verb…>` shape.
[[rules]]
id = "active_spinner"
state = "running"
priority = 970
region = "whole_recent"
visible = true
line_regex = ['^\s*[\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}*\x{25CF}]\s+\p{Lu}\S*(?:\x{2026}|\s+\S*\x{2026})']

# `✻ Waiting for 1 background agent to finish`: the main REPL is between turns
# while background agents run, so the pane shows an idle box with this line in
# the status slot.
[[rules]]
id = "background_agent_wait"
state = "running"
priority = 970
region = "last_non_empty_above_prompt_box"
visible = true
line_regex = ['(?i)^\s*[\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}*\x{25CF}]\s+waiting for \d+ background agents? to finish\s*$']

# There is deliberately no rule for the footer's `· N shells ·` segment: it
# counts live children of the pane's shell, which a user can attach to for the
# session's lifetime, not work the agent is doing.

# MCP tasks still running behind a finished turn.
[[rules]]
id = "background_mcp_task"
state = "running"
priority = 970
region = "bottom_non_empty_lines(12)"
visible = true
line_regex = ['(?i)^[\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}*\x{25CF}]\s+\S.*\x{b7}\s*[1-9]\d*\s+MCP tasks? still running\s*$']
not = [
  { contains_any = [
    "do you want to proceed?",
    "waiting for permission",
    "do you want to allow this connection?",
    "tab to amend",
    "ctrl+e to explain",
  ] },
]

# The first-run folder-trust dialog.
[[rules]]
id = "folder_trust_prompt"
state = "waiting"
priority = 960
region = "collapsed_recent"
visible = true
contains = [
  "is this a project you created or one you trust",
  "yes, i trust this folder",
]

# The completion line a finished turn leaves in the status slot above the input
# box (`✻ Cooked for 1m 58s`).
[[rules]]
id = "completed_turn"
state = "idle"
priority = 500
region = "last_non_empty_above_prompt_box"
visible = true
regex = ['^\s*[\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}*\x{25CF}]\s+\p{Lu}[^\s\x{2026}]*\s+for\s+\d+[smh]\b']
not = [{ contains = ["background agent"] }]

# The banner Claude leaves after the user cancels a turn with Esc.
[[rules]]
id = "interrupt_banner"
state = "idle"
priority = 965
region = "whole_recent"
visible = true
contains = ["what should claude do instead"]

# An empty input box: the agent is parked, waiting for the user to type.
[[rules]]
id = "ready_prompt"
state = "idle"
priority = 480
region = "prompt_box_body"
visible = true
regex = ['^\s*\x{276F}\s*$']

# The static title glyph.
[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
regex = ['^\x{2733}']

# A `waiting` write stands until the screen contradicts it.
[[rules]]
id = "hook_waiting"
state = "waiting"
priority = 300
region = "hook"
hook_status = "waiting"

# A footer wrapped mid-phrase by a narrow pane, where the hint is split across
# lines and no per-line rule can see it.
[[rules]]
id = "interrupt_hint_wrapped"
state = "running"
priority = 490
region = "collapsed_recent"
contains_any = ["esc to interrupt", "ctrl+c to interrupt"]

# An agent-owned viewer shows history, not live state, so no status can be read
# off it and the last known one stands.
[[rules]]
id = "transcript_viewer"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
contains_any = [
  "ctrl+o", "to toggle",
  "ctrl+e", "show all",
  "ctrl+e", "collapse",
  "\u2191\u2193 scroll",
  "? for shortcuts",
]

[[rules]]
id = "model_picker_menu"
priority = 900
region = "whole_recent"
skip_state_update = true
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

# The input box on screen at all, whatever it holds.
[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 350
region = "prompt_box_body"
line_regex = ['^\s*\x{276F}']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
]
