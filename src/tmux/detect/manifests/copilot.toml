id = "copilot"

# Copilot renders a bordered full-screen TUI; its bottom status line is the
# signal. The parked and blocked shapes outrank the working ones, because it
# keeps its spinner rendered under a prompt it is blocked on.
[[rules]]
id = "approval_prompt"
state = "waiting"
priority = 950
region = "whole_recent"
visible = true
any = [
  { contains = ["(y/n)"] },
  { contains = ["[y/n]"] },
  { contains = ["approve"] },
  { contains = ["allow"] },
  { contains = ["continue?"] },
  { contains = ["run command?"] },
  { contains = ["allow this tool"] },
  { contains = ["approve for the rest"] },
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
]

# The parked footer (`/ commands · ? help · tab next tab`), or the input
# prompt itself.
[[rules]]
id = "ready_footer"
state = "waiting"
priority = 940
region = "whole_recent"
visible = true
contains = ["/ commands", "? help", "tab next tab"]

[[rules]]
id = "input_prompt"
state = "waiting"
priority = 940
region = "bottom_non_empty_lines(10)"
visible = true
any = [
  { line_regex = ['^\s*>\s*$'] },
  { line_regex = ['^\s*copilot>\s*$'] },
  { line = { regex = ['^\s*>\s\S.{0,96}$'], not_regex = ['esc'] } },
]

# Only the last three lines: a finished turn leaves its own activity text in
# the transcript, and the status line is always at the bottom.
[[rules]]
id = "footer_spinner"
state = "running"
priority = 930
region = "bottom_non_empty_lines(3)"
visible = true
line_regex = ['[\x{2800}-\x{28FF}]']

[[rules]]
id = "footer_activity"
state = "running"
priority = 920
region = "bottom_non_empty_lines(3)"
visible = true
any = [
  { contains = ["thinking"] },
  { contains = ["working"] },
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["esc cancel"] },
]

[[rules]]
id = "hook_waiting"
state = "waiting"
priority = 900
region = "hook"
hook_status = "waiting"

[[rules]]
id = "hook_running_fresh"
state = "running"
priority = 600
region = "hook"
hook_status = "running"
max_age_secs = 30

[[rules]]
id = "hook_running_standing"
state = "running"
priority = 400
region = "hook"
hook_status = "running"
max_age_secs = 900

[[rules]]
id = "hook_idle"
state = "idle"
priority = 300
region = "hook"
hook_status = "idle"

[[rules]]
id = "hook_error"
state = "error"
priority = 300
region = "hook"
hook_status = "error"
