id = "vibe"

# Vibe's selection menus and approval prompts all outrank its activity signals:
# it keeps rendering a spinner under a menu it is blocked on.
[[rules]]
id = "menu_footer"
state = "waiting"
priority = 980
region = "whole_recent"
visible = true
contains_any = ["↑↓ navigate", "enter select", "esc reject"]

[[rules]]
id = "command_warning"
state = "waiting"
priority = 975
region = "whole_recent"
visible = true
contains = ["⚠", "command"]

[[rules]]
id = "approval_option"
state = "waiting"
priority = 970
region = "whole_recent"
visible = true
contains_any = ["yes and always allow", "no and tell the agent", "› 1.", "› 2.", "› 3."]

[[rules]]
id = "cursor_line"
state = "waiting"
priority = 965
region = "whole_recent"
visible = true
line_regex = ['(?i)^\s*\x{203A}\s*\S']

# Braille only: a middle dot or bullet is separator punctuation in parked output.
# Spinner frames are at most two cells; the logo, always on screen in a short
# session, is braille too but runs longer.
[[rules]]
id = "spinner"
state = "running"
priority = 960
region = "whole_recent"
visible = true
line = { regex = ['[\x{2800}-\x{28FF}]'], not_regex = ['[\x{2800}-\x{28FF}]{3}'] }

# Beside the input prompt these words are transcript or path text: a working
# Vibe draws the spinner there.
[[rules]]
id = "activity_word"
state = "running"
priority = 955
region = "unstacked_recent"
contains_any = [
  "running",
  "reading",
  "writing",
  "executing",
  "processing",
  "generating",
  "thinking",
]
not = [{ region = "whole_recent", line_regex = ['^\s*>(\s|$)'] }]

# A trailing ellipsis on the last line: a status line mid-render.
[[rules]]
id = "trailing_ellipsis"
state = "running"
priority = 950
region = "bottom_non_empty_lines(1)"
any = [
  { line_regex = ['(?i)\x{2026}\s*$'] },
  { line_regex = ['(?i)\.\.\.\s*$'] },
]
