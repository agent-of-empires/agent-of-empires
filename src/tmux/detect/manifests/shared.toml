# Rule shapes several agents share.

# The stock approval phrasings.
[templates.approval_prompt]
state = "waiting"
region = "whole_recent"
visible = true
contains_any = ["(y/n)", "[y/n]", "approve", "allow"]

# A braille spinner frame anywhere in the window.
[templates.spinner]
state = "running"
region = "whole_recent"
visible = true
line_regex = ['[\x{2800}-\x{28FF}]']

[templates.interrupt_hint]
state = "running"
region = "whole_recent"
visible = true
contains_any = ["esc to interrupt", "ctrl+c to interrupt"]

# Parked at an input prompt: a bare `>`, or `> text` that is not a footer
# carrying an interrupt hint.
[templates.input_prompt]
state = "waiting"
region = "bottom_non_empty_lines(10)"
visible = true
any = [
  { line_regex = ['(?i)^\s*>\s*$'] },
  { line = { regex = ['(?i)^\s*>\s\S.{0,96}$'], not_regex = ['(?i)esc'] } },
]

# A line opening with a live activity verb, which is a status line rather than
# narration.
[templates.activity_line]
state = "running"
region = "bottom_non_empty_lines(10)"
visible = true
line = { regex = ['(?i)^\s*(analyzing|applying|building|editing|executing|fetching|generating|grepping|processing|reading|running|searching|testing|thinking|working|writing)[\s.:\x{2026}]'], not_regex = ['(?i)^\s*\w+(?:\W+\w+){0,4}\W+(completed?|done|finished|successful|successfully|success)\b'] }
