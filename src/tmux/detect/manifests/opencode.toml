id = "opencode"

[[rules]]
extends = "interrupt_hint"
id = "interrupt_hint"
priority = 970
contains_any = ["esc to interrupt", "esc interrupt"]

[[rules]]
extends = "spinner"
id = "spinner"
priority = 960

# Standalone: the shared `approve`/`allow` substrings match prose like "the
# approved plan", so only the dialog's own phrasing counts.
[[rules]]
id = "approval_prompt"
state = "waiting"
priority = 950
region = "whole_recent"
visible = true
contains_any = ["(y/n)", "[y/n]", "continue?", "proceed?", "enter to select", "esc to cancel"]

# The permission dialog's option row, which prose does not reproduce.
[[rules]]
id = "permission_dialog"
state = "waiting"
priority = 955
region = "whole_recent"
visible = true
line_regex = ['(?i)allow once\s+allow always']

# A numbered menu row carrying the selection cursor.
[[rules]]
id = "numbered_choice"
state = "waiting"
priority = 940
region = "whole_recent"
visible = true
line_regex = ['(?i)\x{276F}(?:\s*|.* )[123]\.']

# Parked at the input prompt.
[[rules]]
extends = "input_prompt"
id = "input_prompt"
priority = 930
# opencode also parks on a doubled prompt.
any = [{ line_regex = ['(?i)^\s*>>\s*$'] }]
