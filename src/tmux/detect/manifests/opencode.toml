id = "opencode"

[[rules]]
id = "interrupt_hint"
state = "running"
priority = 970
region = "whole_recent"
visible = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["esc interrupt"] },
]

[[rules]]
id = "spinner"
state = "running"
priority = 960
region = "whole_recent"
visible = true
line_regex = ['[\x{2800}-\x{28FF}]']

[[rules]]
id = "approval_prompt"
state = "waiting"
priority = 950
region = "whole_recent"
visible = true
any = [
  { contains = ["(y/n)"] },
  { contains = ["[y/n]"] },
  { contains = ["approve"] },
  { contains = ["allow"] },
  { contains = ["continue?"] },
  { contains = ["proceed?"] },
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
]

# A numbered menu row carrying the selection cursor.
[[rules]]
id = "numbered_choice"
state = "waiting"
priority = 940
region = "whole_recent"
visible = true
line_regex = ['\x{276F}(?:\s*|.* )[123]\.']

# Parked at the input prompt. OpenCode's ready state is reported as Waiting
# rather than Idle, which is what its callers have always seen.
[[rules]]
id = "input_prompt"
state = "waiting"
priority = 930
region = "bottom_non_empty_lines(10)"
visible = true
any = [
  { line_regex = ['^\s*>>?\s*$'] },
  { line = { regex = ['^\s*>\s\S.{0,96}$'], not_regex = ['esc'] } },
]

[[rules]]
id = "hook_waiting"
state = "waiting"
priority = 900
region = "hook"
hook_status = "waiting"

[[rules]]
id = "hook_running_fresh"
state = "running"
priority = 600
region = "hook"
hook_status = "running"
max_age_secs = 30

[[rules]]
id = "hook_running_standing"
state = "running"
priority = 400
region = "hook"
hook_status = "running"
max_age_secs = 900

[[rules]]
id = "hook_idle"
state = "idle"
priority = 300
region = "hook"
hook_status = "idle"

[[rules]]
id = "hook_error"
state = "error"
priority = 300
region = "hook"
hook_status = "error"
