id = "qwen"

[[rules]]
id = "interrupt_hint"
state = "running"
priority = 970
region = "whole_recent"
visible = true
contains_any = ["esc to interrupt", "ctrl+c to interrupt"]

[[rules]]
id = "spinner"
state = "running"
priority = 960
region = "whole_recent"
visible = true
line_regex = ['[\x{2800}-\x{28FF}]']

[[rules]]
id = "approval_prompt"
state = "waiting"
priority = 950
region = "whole_recent"
visible = true
contains_any = [
  "(y/n)",
  "[y/n]",
  "approve",
  "allow",
  "execute?",
  "run command?",
  "enter to select",
  "esc to cancel",
]

# Qwen renders its menu cursor as `›` by default and `❯` in some themes.
[[rules]]
id = "numbered_choice"
state = "waiting"
priority = 940
region = "whole_recent"
visible = true
line_regex = ['^\s*[\x{203A}\x{276F}]\s*[123]\.']

[[rules]]
id = "input_prompt"
state = "waiting"
priority = 930
region = "bottom_non_empty_lines(10)"
visible = true
any = [
  { line_regex = ['^\s*>\s*$'] },
  { line_regex = ['^\s*qwen>\s*$'] },
  { line = { regex = ['^\s*>\s\S.{0,96}$'], not_regex = ['esc'] } },
]
