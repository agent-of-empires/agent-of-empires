id = "omp"
prompt_marker = ['^\s*╭[─-]*\s+\S']

[markers.composer_top]
line_regex = ['^\s*╭[─-]*\s+\S']

# OMP stacks live markers, so positional rules compete by screen position.

# The interrupt token is the positive signal for an active turn, even without a
# spinner frame. Keep it in the live footer and out of recap prose.
[[rules]]
id = "active_interrupt_hint"
state = "running"
priority = 980
positional = true
region = "bottom_non_empty_lines(3)"
visible = true
line_regex = ['^\s*[^※].*⟦esc⟧.*$']
not = [
  { region = "bottom_non_empty_lines(6)", contains = ["dismissed when you send your next message"] },
  { region = "bottom_non_empty_lines(6)", contains_any = ["error: retry budget exhausted", "error: retry failed after"] },
]


# The loader: a frame glyph opening the line, plus either the word `working` or
# an interrupt hint.
[[rules]]
id = "loader_braille"
state = "running"
priority = 960
positional = true
region = "bottom_non_empty_lines(3)"
visible = true
line_regex = ['^\s*[\x{2800}-\x{28FF}] ']
contains_any = ["working", "⟦esc⟧", "⟨esc⟩", "[esc]", "(esc to cancel)"]

[[rules]]
id = "loader_hint_frame"
state = "running"
priority = 960
positional = true
region = "bottom_non_empty_lines(3)"
visible = true
# An ascii spinner frame, or a symbolic one: a leading token of punctuation
# carrying at least one non-ascii character.
any = [
  { line_regex = ['^\s*[-\\|/] '] },
  { line_regex = ['^\s*[^\w\s\x{2022}\x{f111}\x{203B}\x{276F}\x{f054}\x{2502}\x{2503}\x{258F}\x{258E}]*[^\x00-\x7F][^\w\s]* '] },
]
contains_any = ["⟦esc⟧", "⟨esc⟩", "[esc]", "(esc to cancel)"]
# omp's own bullets and panel borders open ordinary rows, so a line led by one
# is never a loader however punctuation-shaped the glyph is.
not = [{ line_regex = ['^\s*[\x{2022}\x{f111}\x{203B}\x{276F}\x{f054}\x{2502}\x{2503}\x{258F}\x{258E}]'] }]

# OMP 18 renders its activity frame and whole-unit timer in the status line.
[[rules]]
id = "active_brand"
state = "running"
priority = 960
positional = true
max_position = 2
region = "bottom_non_empty_lines(3)"
visible = true
line_regex = ['^\s*(?:(?:╭[─-]*|\+[=-]*)\s*)?(?:\x{e0b6}\s+)?\S\s+(?:0|[1-9]\d*)[smh](?:\s+\S+\s+\S|\s*[─-]*(?:╮|\+|\x{e0b0})?\s*$)']
all = [
  { region = "bottom_non_empty_lines(4)", any = [
    { line_regex = ['(?i)^\s*(?:⎋|\x{f12b7}|esc)\s+\S'] },
    { line_regex = ['(?i)^\s*\S+\s+working(?:…|\.\.\.)'] },
    { line_regex = ['(?i)^\s*(?:[\x{2800}-\x{28FF}]|[-\\|/])\s+.*\(esc to cancel\)'] },
    { line_regex = ['(?i)^ {2}cancel\s+\S'] },
  ] },
]
not = [
  { line_regex = ['^\s*(?:(?:╭[─-]*|\+[=-]*)\s*)?(?:\x{e0b6}\s+)?(?:⏱|\x{f017}|◷|◴|⌛)\s+'] },
  # A lowercase word before and after the timer is ordinary duration prose.
  { line_regex = ['^\s*(?:(?:╭[─-]*|\+[=-]*)\s*)?(?:\x{e0b6}\s+)?\p{Ll}\s+(?:0|[1-9]\d*)[smh]\s+\p{Ll}'] },
]

# A wrapped draft moves the band above the fixed bottom-line windows.
[[rules]]
id = "active_composer"
state = "running"
priority = 970
positional = true
region = "from_prompt_marker"
visible = true
line_regex = ['^\s*╭[─-]*\s*\S\s+(?:0|[1-9]\d*)[smh](?:\s+\S+\s+\S|\s*[─-]*╮\s*$)']
all = [
  { region = "above(composer_top, 2)", any = [
    { line_regex = ['(?i)^\s*(?:⎋|\x{f12b7}|esc)\s+\S'] },
    { line_regex = ['(?i)^\s*\S+\s+working(?:…|\.\.\.)'] },
    { line_regex = ['(?i)^\s*(?:[\x{2800}-\x{28FF}]|[-\\|/])\s+.*\(esc to cancel\)'] },
    { line_regex = ['(?i)^ {2}cancel\s+\S'] },
  ] },
  { region = "after(composer_top)", regex = ['\A(?:[^\S\n]*│[^\n]*│[^\S\n]*\n)+[^\S\n]*╰[─-][^\n]*╯[^\S\n]*\z'] },
]
not = [
  { line_regex = ['^\s*╭[─-]*\s*(?:⏱|\x{f017}|◷|◴|⌛)\s+'] },
  { line_regex = ['^\s*╭[─-]*\s*\p{Ll}\s+(?:0|[1-9]\d*)[smh]\s+\p{Ll}'] },
]

# Bottom status rows pair a braille turn timer with a nearby activity hint, in
# every composer shape that parks one at the bottom.
[[rules]]
id = "active_statusline"
state = "running"
priority = 960
positional = true
region = "bottom_non_empty_lines(3)"
visible = true
line_regex = ['^\s*(?:(?:╭[─-]*|\+[=-]*)\s*)?[\x{2800}-\x{28FF}]\s+(?:0|[1-9]\d*)[smh](?:\s|$)']
all = [
  { region = "bottom_non_empty_lines(8)", any = [
    { line_regex = ['(?i)^\s*(?:⎋|\x{f12b7}|esc)\s+\S'] },
    { line_regex = ['(?i)^\s*\S+\s+working(?:…|\.\.\.)'] },
    { line_regex = ['(?i)^\s*(?:[\x{2800}-\x{28FF}]|[-\\|/])\s+.*\(esc to cancel\)'] },
    { line_regex = ['(?i)^ {2}cancel\s+\S'] },
  ] },
]
not = [
  { line_regex = ['^\s*(?:(?:╭[─-]*|\+[=-]*)\s*)?(?:\x{e0b6}\s+)?(?:⏱|\x{f017}|◷|◴|⌛)\s+'] },
  # Live ask panel
  { region = "bottom_non_empty_lines(12)", all = [
    { line_regex = ['(?i)^\s*(?:╭[─-]*|\+[=-]*)\s*ask\b'] },
    { line_regex = ['^\s*[│|].*[│|]\s*$'], contains_any = [
      "enter select · n note",
      "space toggle · enter ",
      "enter submit · ↑/↓ scroll",
      "current prompt to answer",
    ] },
  ] },
]

# Presets without the pi segment expose one bottommost interrupt row.
[[rules]]
id = "active_interrupt"
state = "running"
priority = 960
positional = true
max_position = 1
region = "bottom_non_empty_lines(3)"
visible = true
line_regex = ['(?i)^\s*(?:⎋|\x{f12b7}|esc)\s+working(?:…|\.\.\.)\s*$']
not = [
  { region = "bottom_non_empty_lines(3)", line_regex = ['^\s*(?:(?:╭[─-]*|\+[=-]*)\s*)?(?:π|\x{f0d57}|pi)\s+'] },
  { region = "bottom_non_empty_lines(3)", line_regex = ['(?i)^\s*(?:⎋|\x{f12b7}|esc)\s+working(?:…|\.\.\.)\s*$'], min_lines = 2 },
]

# The wrapped variant: the frame line runs on and the hint lands on an indented
# continuation.
[[rules]]
id = "loader_wrapped"
state = "running"
priority = 960
positional = true
wrap = 2
max_position = 3
region = "bottom_non_empty_lines(4)"
visible = true
regex = ['(?s)^\s*(?:[\x{2800}-\x{28FF}]|[-\\|/]|[^\w\s\x{2022}\x{f111}\x{203B}\x{276F}\x{f054}\x{2502}\x{2503}\x{258F}\x{258E}]*[^\x00-\x7F][^\w\s]*) [^\n]*\n[ \t]+\S']
contains_any = ["⟦esc⟧", "⟨esc⟩", "[esc]", "(esc to cancel)"]
not = [
  { line_regex = ['^\s*[\x{2022}\x{f111}\x{203B}\x{276F}\x{f054}\x{2502}\x{2503}\x{258F}\x{258E}]'] },
  { line_regex = ['^\s*\S+ [^\n]*(?:⟦esc⟧|⟨esc⟩|\[esc\]|\(esc to cancel\))[^\n]*$'] },
  { line = { regex = ['^\s*\S+ [^\n]*[.!?:;]\s*$'], not_regex = ['\.\.\.\s*$'] } },
]

# The retry countdown, which a narrow pane wraps across the window.
[[rules]]
id = "retry_countdown"
state = "running"
priority = 960
positional = true
wrap = 6
region = "bottom_non_empty_lines(6)"
visible = true
regex = ['(?i)retrying\s+\(\d+/\d+\)\s+in\s+\d+\s*s\s*\x{2026}']

[[rules]]
id = "banner_dismissal"
state = "error"
priority = 960
positional = true
region = "bottom_non_empty_lines(6)"
visible = true
contains = ["dismissed when you send your next message"]

[[rules]]
id = "retry_exhausted"
state = "error"
priority = 960
positional = true
region = "bottom_non_empty_lines(6)"
visible = true
contains_any = ["error: retry budget exhausted", "error: retry failed after"]

# A prompt panel's footer row.
[[rules]]
id = "panel_prompt"
state = "waiting"
priority = 960
positional = true
region = "bottom_non_empty_lines(8)"
visible = true
line_regex = ['^\s*[│|].*[│|]\s*$']
contains_any = [
  "enter select · n note",
  "space toggle · enter ",
  "enter submit · ↑/↓ scroll",
  "current prompt to answer",
]
not = [
  { region = "bottom_non_empty_lines(8)", line_regex = ['^\s*(?:╭|\+).*(?:π|\x{f0d57}|pi)\s*>'], not = [
    { line_regex = ['(?i)^\s*(?:╭[─-]*|\+[=-]*)\s*ask\b'] },
  ] },
]

# Generic OMP selectors use a selected row, multiple options, and a keyboard footer.
[[rules]]
id = "selector_panel"
state = "waiting"
priority = 970
positional = true
max_position = 12
region = "bottom_non_empty_lines(12)"
visible = true
line_regex = ['(?i)^\s*[│|].*(?:navigate|scroll|select|confirm|open).*(?:esc|⎋|cancel).*[│|]\s*$']
all = [
  { region = "bottom_non_empty_lines(12)", line_regex = ['^\s*[│|]\s*(?:[\x{276F}\x{f054}>])\s+\S[^│|]*[│|]\s*$'] },
  { region = "bottom_non_empty_lines(12)", line_regex = ['^\s*[│|]\s*(?:[\x{276F}\x{f054}>]\s+\S|\s{2,}\S|\p{Lu})[^│|]*[│|]\s*$'], min_lines = 2 },
]
not = [
  { region = "bottom_non_empty_lines(12)", line_regex = ['^\s*(?:╭[─-]*|\+[=-]*)\s*(?:π|\x{f0d57}|pi)\s*>'] },
  { region = "bottom_non_empty_lines(3)", contains_any = ["⟦esc⟧", "⟨esc⟩", "[esc]", "(esc to cancel)"] },
  { region = "bottom_non_empty_lines(3)", line_regex = ['(?i)^\s*(?:⎋|\x{f12b7}|esc)\s+working(?:…|\.\.\.)'] },
]

# omp's own retry labels, which keep rendering between attempts.
[[rules]]
id = "retry_labels"
state = "running"
priority = 960
positional = true
region = "bottom_non_empty_lines(12)"
visible = true
any = [
  { line_regex = ['(?i)retrying \d+/\d+ (in (\d+(\.\d+)?ms|\d+\.\d+s|\d+m(\d+s)?|\d+h(\d+m)?|\d+d(\d+h)?)|now):'] },
  { line_regex = ['(?i)attempt \d+/\d+ \x{b7}'] },
]

# A terminal failure banner: omp has stopped and is waiting to be dismissed.
