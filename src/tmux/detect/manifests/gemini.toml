id = "gemini"

[[rules]]
id = "interrupt_hint"
state = "running"
priority = 970
region = "whole_recent"
visible = true
contains_any = ["esc to interrupt", "ctrl+c to interrupt"]

[[rules]]
id = "spinner"
state = "running"
priority = 960
region = "whole_recent"
visible = true
line_regex = ['[\x{2800}-\x{28FF}]']

[[rules]]
id = "approval_prompt"
state = "waiting"
priority = 950
region = "whole_recent"
visible = true
contains_any = [
  "(y/n)",
  "[y/n]",
  "approve",
  "allow",
  "execute?",
  "enter to select",
  "esc to cancel",
]

# Only a bare `>`: Gemini renders ordinary prose behind the same glyph, so the
# `> something` form the other agents accept would fire on transcript text.
[[rules]]
id = "input_prompt"
state = "waiting"
priority = 930
region = "bottom_non_empty_lines(10)"
visible = true
line_regex = ['^\s*>\s*$']
