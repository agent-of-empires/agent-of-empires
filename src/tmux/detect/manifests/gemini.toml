id = "gemini"

# The trust dialog's first choice row, inside its border, so neither quoted
# prose nor a composer repeating the label can stand in for it. The quoted-prose
# veto below uses the same predicate.
[markers.trust_choice]
line_regex = ['(?i)^\s*\x{2502}\s*(?:\x{25CF}\s*)?(?:1\.\s+)?trust folder\b']

[[rules]]
extends = "interrupt_hint"
id = "interrupt_hint"
priority = 970

[[rules]]
extends = "spinner"
id = "spinner"
priority = 960

# The first-run folder-trust dialog. Its text stays on screen after Gemini
# restarts into the composer, which then decides instead.
[[rules]]
id = "folder_trust_prompt"
state = "waiting"
priority = 955
region = "collapsed_recent"
visible = true
contains = ["do you trust the files in this folder?", "trust folder (", "don't trust"]
not = [
  { region = "after(trust_choice)", line_regex = ['^\s*>(?:\s|$)'] },
  # Quoted in the transcript: a composer is up and no `trust_choice` row is.
  { region = "whole_recent", line_regex = ['^\s*>(?:\s|$)'], not = [{ region = "whole_recent", line_regex = ['(?i)^\s*\x{2502}\s*(?:\x{25CF}\s*)?(?:1\.\s+)?trust folder\b'] }] },
]

[[rules]]
extends = "approval_prompt"
id = "approval_prompt"
priority = 950
contains_any = ["execute?", "enter to select", "esc to cancel"]

[[rules]]
extends = "approval_choice"
id = "approval_choice"
priority = 950

# Only a bare `>`: Gemini renders ordinary prose behind the same glyph, so the
# `> something` form the other agents accept would fire on transcript text.
[[rules]]
extends = "input_prompt"
id = "input_prompt"
priority = 930
line_regex = ['(?i)^\s*>\s*$']
