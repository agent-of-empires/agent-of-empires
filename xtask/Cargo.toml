[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Only `cli::Cli` is used, and that is feature-independent now that the
# daemon is core. Staying on default features keeps `cargo xtask gen-docs`
# free of the frontend build.
agent-of-empires = { path = ".." }
aoe-plugin-api = { path = "../aoe-plugin-api" }
clap = { version = "4.6", features = ["derive"] }
clap-markdown = "0.1"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.14"
toml = "1.1"

[target.'cfg(unix)'.dependencies]
ctrlc = "3"
nix = { version = "0.31", features = ["signal"] }
notify = "8.2"
